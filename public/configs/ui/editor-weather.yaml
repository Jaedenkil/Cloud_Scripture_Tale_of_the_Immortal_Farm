# ═══════════════════════════════════════════════════════════════
# 天气/时间编辑器 (Weather & Time Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第二层 · 内容构件
#
# 作用：
#   定义天气类型的物理驱动参数和昼夜循环系统。
#   天气通过粒子系统、光照修改、雾效、风力等物理参数驱动，
#   而非简单的视觉滤镜，确保天气对游戏世界产生真实影响。
#
# 核心功能：
#   【天气编辑】
#   - 粒子系统参数：粒子纹理（引用粒子编辑器模板）、发射密度、
#     速度/方向/扩散角、粒子大小、生命周期
#   - 光照修改：环境光强度偏移、色温偏移（冷/暖）、阴影强度
#   - 雾效参数：雾密度、雾颜色、可视距离
#   - 风力系统：风向、风速、阵风频率、对粒子/植物/旗帜的影响
#   - 地表效果：湿度增加（雨）、积雪覆盖（雪）、冰冻（霜）、干旱
#   - 对生物影响：移动速度系数、灵力恢复系数
#   - 对灵植影响：生长速度系数、存活率系数
#   - 环境音效：对应天气的循环音效（引用音效编辑器输出）
#
#   【时间编辑】
#   - 昼夜周期：一天总时长（tick 数）
#   - 时段划分：黎明/白天/黄昏/夜晚的起止时刻
#   - 光照曲线：各时段的环境光强度、太阳方向角度、天空颜色渐变
#   - 天气调度：各时段天气触发概率表
#   - 温度曲线：随时段变化的温度（影响天气和灵植）
#
# 输出配置：
#   configs/weather/*.yaml — 天气类型定义
#   configs/time.yaml — 时间系统全局配置
#
#   格式示例（天气）：
#     weather:
#       id: "spiritual_rain"
#       name: "灵雨"
#       particle: "ptc_rain_spiritual"   # 粒子模板 ID
#       light:
#         intensityOffset: -0.3
#         colorTempOffset: -500          # 偏冷
#       fog:
#         density: 0.25
#         color: "#8899AA"
#         viewDistance: 48
#       wind:
#         direction: [0.3, -0.8, 0.1]
#         speed: 2.5
#         gustFrequency: 0.3
#       groundEffect: "wet"
#       creatureModifiers:
#         moveSpeed: 0.85
#         spiritRegen: 1.5              # 灵雨增强灵力恢复
#       plantModifiers:
#         growthSpeed: 1.3
#       ambientSound: "sfx_rain_spiritual"
#
#   格式示例（时间）：
#     time:
#       dayLength: 2400                  # 一天 2400 tick
#       periods:
#         dawn:    { start: 0,    end: 300,  lightIntensity: [0.2, 0.7] }
#         day:     { start: 300,  end: 1400, lightIntensity: [0.7, 1.0] }
#         dusk:    { start: 1400, end: 1700, lightIntensity: [1.0, 0.3] }
#         night:   { start: 1700, end: 2400, lightIntensity: [0.3, 0.1] }
#       weatherSchedule:
#         day:   { clear: 0.6, cloudy: 0.2, rain: 0.15, storm: 0.05 }
#         night: { clear: 0.5, cloudy: 0.2, fog: 0.2, rain: 0.1 }
#
# 依赖：粒子编辑器（粒子模板）、音效编辑器（环境音效）
# 被引用方：场景编辑器（场景默认天气）、群落编辑器（群落天气权重）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_weather
  name: 天气/时间编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "天气/时间编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义天气类型的物理驱动参数和昼夜循环系统。天气通过粒子系统、光照修改、雾效、风力等物理参数驱动，确保天气对游戏世界产生真实影响。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
