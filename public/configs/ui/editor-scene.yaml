# ═══════════════════════════════════════════════════════════════
# 场景/地图编辑器 (Scene & Map Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第三层 · 场景组合
#
# 作用：
#   定义游戏中所有独立场景及其切换关系。
#   游戏世界由多个场景组成，通过传送门(portal)连接，
#   玩家触发入口时切换加载目标场景。
#
# 场景类型：
#   - overworld（地表）：开放世界，无限区块，昼夜天气循环
#   - underground（地底）：垂直分层，暗光环境，矿脉丰富
#   - cave（洞穴）：蠕虫算法生成不规则空腔，狭窄通道
#   - dungeon（副本）：房间+走廊算法，机关/宝箱/Boss
#   - pocket-realm（洞天福地）：固定边界小世界，仙人洞府/秘境
#
# 核心功能：
#   - 场景元数据：名称、类型、尺寸边界
#   - 地形生成：选择生成算法 + 配置算法参数
#     （不同场景类型对应不同算法：simplex噪声/蠕虫雕刻/房间走廊）
#   - 群落分布：指定场景内使用的群落及其空间分布规则
#     （引用群落编辑器输出）
#   - 环境参数：环境光强度/颜色、雾效、默认天气（无天气=洞穴）
#   - 传送门配置：入口/出口位置 → 目标场景ID + 目标传送门ID
#   - 固定物件：灵泉/石碑/宝箱/NPC刷新点的位置和引用
#   - 生物刷新覆盖：场景级生物生成规则（覆盖群落默认值）
#   - 场景连接图：可视化查看所有场景之间的传送门连接关系
#
# 输出配置：configs/scenes/*.yaml
#   格式示例：
#     scene:
#       id: "underground_cave_01"
#       name: "幽冥石窟"
#       type: "cave"
#       bounds: { width: 64, height: 32, depth: 64 }
#       terrain:
#         generator: "worm_carver"
#         params:
#           wormCount: 8
#           wormLength: [20, 50]
#           wormRadius: [2, 5]
#           noise:
#             frequency: 0.08
#             threshold: 0.45
#         blockPalette:
#           wall: "dark_stone"
#           floor: "moss_stone"
#           ceiling: "drip_stone"
#           ore:
#             - block: "spirit_crystal_ore"
#               chance: 0.03
#       environment:
#         ambientLight: 0.15
#         lightColor: "#4A6A8A"
#         fogDensity: 0.4
#         fogColor: "#1A2A3A"
#         weather: "none"
#         ambientSound: "sfx_cave_ambient"
#       portals:
#         - id: "entrance"
#           position: [32, 30, 32]
#           targetScene: "overworld"
#           targetPortal: "cave_exit_01"
#         - id: "deep_passage"
#           position: [10, 5, 48]
#           targetScene: "deep_underground_01"
#           targetPortal: "upper_entrance"
#       spawns:
#         - species: "cave_bat"
#           density: 0.02
#           template: "normal"
#         - species: "stone_golem"
#           density: 0.005
#           template: "elite"
#       features:
#         - type: "spirit_spring"
#           position: [30, 8, 30]
#         - type: "ancient_tablet"
#           position: [15, 12, 40]
#
# 依赖：群落编辑器（群落引用）、物块编辑器（方块调色板）、
#       物种编辑器（生物生成）、天气编辑器（环境天气）、
#       音效编辑器（环境音）
# 被引用方：渲染内核 SceneRouter（场景加载入口）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_scene
  name: 场景/地图编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "场景/地图编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义游戏中所有独立场景及其切换关系。游戏世界由多个场景组成，通过传送门连接，玩家触发入口时切换加载目标场景。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
