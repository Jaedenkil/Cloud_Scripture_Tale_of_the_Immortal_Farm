# UI 主题配置
# 天蓝亮色风格：清新明亮，天蓝为主色调

theme:
  name: 天蓝清韵
  version: "2.0.0"

# 颜色变量
colors:
  # 主色调
  primary: "#4A9BE8"          # 天蓝 - 主色
  primaryLight: "#6BB3F0"     # 亮天蓝
  primaryDark: "#2E7BC4"      # 深天蓝
  accent: "#FF9F43"           # 暖橙 - 强调色/点睛

  # 背景色
  bgDark: "rgba(18, 32, 48, 0.95)"       # 深蓝夜色
  bgMedium: "rgba(30, 52, 78, 0.90)"     # 中蓝背景
  bgLight: "rgba(50, 80, 115, 0.80)"     # 亮蓝背景

  # 文字色
  textPrimary: "#FFFFFF"      # 纯白 - 主文字
  textSecondary: "#B0D4F1"    # 浅蓝白 - 次文字
  textMuted: "#6B8DAB"        # 灰蓝 - 弱化文字
  btnTextAction: "#1A1A1A"    # 黑色 - 主体功能按钮文字（页面跳转类）
  btnTextNormal: "#FFFFFF"    # 白色 - 普通按钮文字（标签切换等）

  # 功能色（亮色系）
  success: "#2ED573"          # 翠绿
  warning: "#FFA502"          # 琥珀橙
  danger: "#FF4757"           # 亮红
  info: "#70A1FF"             # 信息蓝

  # 按钮功能色
  btnPrimary: "#4A9BE8"       # 主操作 - 天蓝
  btnSecondary: "#576E86"     # 次要操作 - 灰蓝
  btnSuccess: "#2ED573"       # 确认/开始 - 翠绿
  btnDanger: "#FF4757"        # 危险/退出 - 亮红
  btnWarning: "#FFA502"       # 警告/特殊 - 琥珀橙
  btnNeutral: "#57606F"       # 中性/取消 - 深灰

  # 边框/分隔线
  border: "rgba(74, 155, 232, 0.4)"
  borderHover: "rgba(74, 155, 232, 0.7)"
  divider: "rgba(74, 155, 232, 0.3)"

# 字体配置
fonts:
  title: "'Microsoft YaHei', 'Noto Sans SC', sans-serif"
  heading: "'Microsoft YaHei', 'Noto Sans SC', sans-serif"
  body: "'Microsoft YaHei', 'Noto Sans SC', sans-serif"
  mono: "Consolas, 'Source Code Pro', monospace"

# 尺寸配置（基于 640×360 虚拟分辨率）
sizes:
  # 字体大小及配套行高（行高 = fontSize × 1.4，确保文字含内边距完整显示）
  titleLarge: 24              # 大标题
  titleLargeHeight: "34px"    # 大标题行高
  titleSmall: 18              # 小标题
  titleSmallHeight: "25px"    # 小标题行高
  textNormal: 14              # 正常内容文字
  textNormalHeight: "20px"    # 正文行高
  textSmall: 8                # 辅助小字
  textSmallHeight: "12px"     # 辅助小字行高

  # 按钮
  buttonWidth: "93px"
  buttonHeight: "19px"
  buttonFontSize: 8
  buttonCornerRadius: 3
  buttonBorderWidth: 1        # 按钮描边粗细

  # 面板
  panelCornerRadius: 4
  panelPadding: "17px"        # 窗口整体内边距

  # 间距
  spacingMin: "3px"           # 最小间距
  spacingSm: "4px"
  spacingMd: "7px"
  spacingLg: "10px"
  spacingXl: "17px"

  # 分隔线
  dividerHeight: "1px"        # 分割线固定 1px

# 动画配置
animations:
  fadeIn:
    duration: 300
    easing: easeOutQuad

  fadeOut:
    duration: 200
    easing: easeInQuad

  slideIn:
    duration: 400
    easing: easeOutBack

  buttonHover:
    duration: 150
    easing: linear

# 组件默认样式
components:
  button:
    width: "$buttonWidth"
    height: "$buttonHeight"
    fontSize: "$buttonFontSize"
    cornerRadius: "$buttonCornerRadius"
    background: "$btnPrimary"
    color: "$textPrimary"
    hoverBackground: "$primaryLight"
    activeBackground: "$primaryDark"
    borderWidth: 2
    borderColor: "$primaryLight"

  panel:
    background: "$bgMedium"
    cornerRadius: "$panelCornerRadius"
    borderWidth: 2
    borderColor: "$border"

  title:
    fontFamily: "$title"
    fontSize: 36
    color: "$textPrimary"
    shadowColor: "rgba(74, 155, 232, 0.4)"
    shadowBlur: 12

  text:
    fontFamily: "$body"
    color: "$textSecondary"
    fontSize: 24

  slider:
    trackHeight: "8px"
    trackBackground: "rgba(0, 0, 0, 0.3)"
    fillColor: "$primary"
    thumbSize: "20px"
    thumbColor: "$accent"

  toggle:
    width: "48px"
    height: "24px"
    background: "rgba(80, 80, 80, 0.6)"
    activeBackground: "$primary"
    thumbColor: "$textPrimary"
