# ═══════════════════════════════════════════════════════════════
# 粒子/特效编辑器 (Particle & VFX Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第二层 · 内容构件
#
# 作用：
#   定义可复用的粒子系统和视觉特效模板。
#   粒子/特效是天气、法术、环境氛围、交互反馈的视觉基础。
#
# 核心功能：
#   - 发射器配置：发射器形状（点/球/盒/圆锥/线）、发射速率、
#     爆发模式（一次性/持续）、发射方向和扩散角
#   - 粒子生命周期：存活时间、存活时间随机范围
#   - 运动参数：初始速度、加速度/重力影响、速度随时间曲线、
#     旋转速度、螺旋运动参数
#   - 视觉参数：
#     · 纹理：引用材质编辑器中的粒子纹理
#     · 颜色渐变：出生颜色 → 消亡颜色的渐变曲线
#     · 大小曲线：出生大小 → 消亡大小
#     · 透明度曲线：淡入 → 淡出
#   - 混合模式：叠加(additive)、Alpha混合、正片叠底
#   - 子发射器：粒子消亡时可触发子粒子（如火花 → 烟雾）
#   - 实时预览：在编辑器内 3D 预览粒子效果
#
# 输出配置：configs/particles/*.yaml
#   格式示例：
#     particle:
#       id: "ptc_rain_spiritual"
#       name: "灵雨粒子"
#       emitter:
#         shape: "box"
#         size: [64, 1, 64]
#         rate: 500
#         mode: "continuous"
#       lifetime: [0.6, 1.2]
#       velocity:
#         initial: [0, -12, 0]
#         gravity: -2
#       visual:
#         texture: "mat_particle_raindrop"
#         colorGradient:
#           - time: 0.0
#             color: "rgba(136, 200, 255, 0.8)"
#           - time: 1.0
#             color: "rgba(136, 200, 255, 0.0)"
#         sizeRange: [0.02, 0.05]
#         blendMode: "additive"
#
# 依赖：材质编辑器（粒子纹理）
# 被引用方：天气编辑器（天气粒子）、物种编辑器（法术特效）、
#           场景编辑器（环境氛围特效）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_particle
  name: 粒子/特效编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "粒子/特效编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义可复用的粒子系统和视觉特效模板。粒子/特效是天气、法术、环境氛围、交互反馈的视觉基础。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
