# 开发者工具页面配置
# 参考：settings.yaml 同款标题 + 底部操作栏布局
# 坐标系：Babylon.js GUI 以父容器中心为原点 (0,0)
# 虚拟分辨率 640×360，中心 (0,0)，上=-180，下=+180，左=-320，右=+320

page:
  id: dev_tools
  name: 开发者工具
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  # 背景遮罩（全屏半透明）
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  # ═══════════════════════════════════════
  # 主面板（全屏，所有子元素从中心定位）
  # ═══════════════════════════════════════
  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:

      # ─────────── 标题区域 ───────────
      - id: headerArea
        type: stack
        layout:
          isVertical: true
          spacing: 2
          top: "-135px"
        style:
          width: "100%"
        children:
          - id: devToolsTitle
            type: title
            text: "开发者工具"
            style:
              width: "100%"
              height: "$titleLargeHeight"
              fontSize: "$titleLarge"
              color: "$textPrimary"
              textAlign: center
              shadowColor: "rgba(74, 155, 232, 0.35)"
              shadowBlur: 3

          - id: devToolsSub
            type: text
            text: "D E V   T O O L S"
            style:
              width: "100%"
              height: "$textSmallHeight"
              fontSize: "$textSmall"
              color: "$textMuted"
              textAlign: center

      # ─────────── 标题下分隔线 ───────────
      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-96px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 中间内容区域（暂空） ───────────

      # ─────────── 底部分隔线 ───────────
      - id: footerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "122px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 操作按钮栏 ───────────
      - id: actionBar
        type: stack
        layout:
          isVertical: false
          spacing: 10
          top: "140px"
        style:
          height: "19px"
        children:
          - id: cancelBtn
            type: button
            text: "取消"
            action: cancelDevTools
            style:
              width: "53px"
              height: "17px"
              background: "$btnNeutral"
              color: "$btnTextAction"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              thickness: "$buttonBorderWidth"
              borderColor: "#7A8290"

actions:
  cancelDevTools:
    type: goBack

keybindings:
  Escape:
    action: cancelDevTools
