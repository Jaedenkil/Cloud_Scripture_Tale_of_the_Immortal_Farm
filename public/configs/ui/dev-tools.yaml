# 开发者工具页面配置
# 参考：settings.yaml 同款标题 + 底部操作栏布局
# 坐标系：Babylon.js GUI 以父容器中心为原点 (0,0)
# 虚拟分辨率 640×360，中心 (0,0)，上=-180，下=+180，左=-320，右=+320

page:
  id: dev_tools
  name: 开发者工具
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  # 背景遮罩（全屏半透明）
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  # ═══════════════════════════════════════
  # 主面板（全屏，所有子元素从中心定位）
  # ═══════════════════════════════════════
  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:

      # ─────────── 标题区域 ───────────
      - id: headerArea
        type: stack
        layout:
          isVertical: true
          spacing: 2
          top: "-135px"
        style:
          width: "100%"
        children:
          - id: devToolsTitle
            type: title
            text: "开发者工具"
            style:
              width: "100%"
              height: "$titleLargeHeight"
              fontSize: "$titleLarge"
              color: "$textPrimary"
              textAlign: center
              shadowColor: "rgba(74, 155, 232, 0.35)"
              shadowBlur: 3

          - id: devToolsSub
            type: text
            text: "D E V   T O O L S"
            style:
              width: "100%"
              height: "$textSmallHeight"
              fontSize: "$textSmall"
              color: "$textMuted"
              textAlign: center

      # ─────────── 标题下分隔线 ───────────
      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-96px"
        style:
          background: "$divider"
          thickness: 0

      # ═══════════════════════════════════════
      # 编辑器入口（3层 × 12个编辑器）
      # ═══════════════════════════════════════

      # ─── 第一层：基础资源 ───
      - id: layer1Label
        type: text
        text: "── 基础资源 ──"
        layout:
          top: "-78px"
        style:
          width: "100%"
          height: "$textSmallHeight"
          fontSize: "$textSmall"
          color: "$textMuted"
          textAlign: center

      - id: layer1Row
        type: stack
        layout:
          isVertical: false
          spacing: 6
          top: "-62px"
        style:
          height: "22px"
        children:
          - id: btnEditorResource
            type: button
            text: "资源管理"
            action: openEditorResource
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnPrimary"
              color: "$btnTextNormal"
              thickness: "$buttonBorderWidth"
              borderColor: "$primaryLight"

          - id: btnEditorMaterial
            type: button
            text: "材质编辑"
            action: openEditorMaterial
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnPrimary"
              color: "$btnTextNormal"
              thickness: "$buttonBorderWidth"
              borderColor: "$primaryLight"

          - id: btnEditorAudio
            type: button
            text: "音效编辑"
            action: openEditorAudio
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnPrimary"
              color: "$btnTextNormal"
              thickness: "$buttonBorderWidth"
              borderColor: "$primaryLight"

      # ─── 第二层：内容构件 ───
      - id: layer2Label
        type: text
        text: "── 内容构件 ──"
        layout:
          top: "-32px"
        style:
          width: "100%"
          height: "$textSmallHeight"
          fontSize: "$textSmall"
          color: "$textMuted"
          textAlign: center

      - id: layer2Row1
        type: stack
        layout:
          isVertical: false
          spacing: 6
          top: "-16px"
        style:
          height: "22px"
        children:
          - id: btnEditorBlock
            type: button
            text: "物块编辑"
            action: openEditorBlock
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnWarning"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$warning"

          - id: btnEditorSpecies
            type: button
            text: "物种编辑"
            action: openEditorSpecies
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnWarning"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$warning"

          - id: btnEditorItem
            type: button
            text: "物品编辑"
            action: openEditorItem
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnWarning"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$warning"

      - id: layer2Row2
        type: stack
        layout:
          isVertical: false
          spacing: 6
          top: "12px"
        style:
          height: "22px"
        children:
          - id: btnEditorWeather
            type: button
            text: "天气/时间"
            action: openEditorWeather
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnWarning"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$warning"

          - id: btnEditorParticle
            type: button
            text: "粒子/特效"
            action: openEditorParticle
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnWarning"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$warning"

      # ─── 第三层：场景组合 ───
      - id: layer3Label
        type: text
        text: "── 场景组合 ──"
        layout:
          top: "42px"
        style:
          width: "100%"
          height: "$textSmallHeight"
          fontSize: "$textSmall"
          color: "$textMuted"
          textAlign: center

      - id: layer3Row
        type: stack
        layout:
          isVertical: false
          spacing: 6
          top: "58px"
        style:
          height: "22px"
        children:
          - id: btnEditorBiome
            type: button
            text: "群落编辑"
            action: openEditorBiome
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnSuccess"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$success"

          - id: btnEditorScene
            type: button
            text: "场景/地图"
            action: openEditorScene
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnSuccess"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$success"

          - id: btnEditorCharacter
            type: button
            text: "角色编辑"
            action: openEditorCharacter
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnSuccess"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$success"

          - id: btnEditorRenderStyle
            type: button
            text: "渲染风格"
            action: openEditorRenderStyle
            style:
              width: "80px"
              height: "22px"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              background: "$btnSuccess"
              color: "$btnTextAction"
              thickness: "$buttonBorderWidth"
              borderColor: "$success"

      # ─────────── 底部分隔线 ───────────
      - id: footerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "122px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 操作按钮栏 ───────────
      - id: actionBar
        type: stack
        layout:
          isVertical: false
          spacing: 10
          top: "140px"
        style:
          height: "19px"
        children:
          - id: cancelBtn
            type: button
            text: "取消"
            action: cancelDevTools
            style:
              width: "53px"
              height: "17px"
              background: "$btnNeutral"
              color: "$btnTextAction"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              thickness: "$buttonBorderWidth"
              borderColor: "#7A8290"

actions:
  cancelDevTools:
    type: goBack

  # 第一层：基础资源
  openEditorResource:
    type: setState
    state: EDITOR_RESOURCE
  openEditorMaterial:
    type: setState
    state: EDITOR_MATERIAL
  openEditorAudio:
    type: setState
    state: EDITOR_AUDIO

  # 第二层：内容构件
  openEditorBlock:
    type: setState
    state: EDITOR_BLOCK
  openEditorSpecies:
    type: setState
    state: EDITOR_SPECIES
  openEditorItem:
    type: setState
    state: EDITOR_ITEM
  openEditorWeather:
    type: setState
    state: EDITOR_WEATHER
  openEditorParticle:
    type: setState
    state: EDITOR_PARTICLE

  # 第三层：场景组合
  openEditorBiome:
    type: setState
    state: EDITOR_BIOME
  openEditorScene:
    type: setState
    state: EDITOR_SCENE
  openEditorCharacter:
    type: setState
    state: EDITOR_CHARACTER
  openEditorRenderStyle:
    type: setState
    state: EDITOR_RENDER_STYLE

keybindings:
  Escape:
    action: cancelDevTools
