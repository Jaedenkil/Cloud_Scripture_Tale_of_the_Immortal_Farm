# ═══════════════════════════════════════════════════════════════
# 角色编辑器 (Character Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第三层 · 场景组合
#
# 作用：
#   在物种模板基础上创建具体的游戏角色（玩家角色、NPC、敌人）。
#   物种定义了「什么生物」，角色定义了「这个生物是谁、做什么」。
#
# 核心功能：
#   - 物种选择：选择基础物种模板（引用物种编辑器输出）
#   - 外观覆盖：在物种基础纹理上叠加个性化外观
#     · 发型/头饰替换纹理区域
#     · 服饰/铠甲覆盖纹理
#     · 配色方案（色相/饱和度偏移）
#   - 属性微调：在物种模板基础上的个体差异
#     · 属性加成/减成（如该角色力量额外 +5%）
#     · 等级/经验设定
#   - AI 行为预设：
#     · 巡逻(patrol)：沿路径点巡逻
#     · 守卫(guard)：驻守区域，敌人进入时攻击
#     · 商人(merchant)：站立等待交互，打开商品列表
#     · 任务NPC(quest)：站立等待交互，触发对话/任务
#     · 野生(wild)：自由游荡，被攻击时反击或逃跑
#     · Boss：固定区域，触发战斗阶段机制
#   - 对话配置引用：指向外部对话脚本文件
#   - 功能绑定：商人→商品列表ID、铁匠→锻造配方组ID、
#     长老→任务线ID
#   - 3D 预览：在编辑器中预览角色外观（物种骨架+外观覆盖）
#
# 输出配置：configs/characters/*.yaml
#   格式示例：
#     character:
#       id: "npc_elder_chen"
#       name: "陈长老"
#       species: "human_base"          # 物种模板 ID
#       template: "normal"             # 物种模板等级
#       appearance:
#         overrides:
#           - region: "head"
#             texture: "mat_elder_chen_head"
#           - region: "body"
#             texture: "mat_elder_robe_blue"
#         colorShift:
#           hue: 0
#           saturation: -0.1
#       stats:
#         levelOverride: 15
#         bonuses:
#           spirit: 1.5
#       ai:
#         behavior: "quest"
#         idleAnimation: "meditate"
#       dialogue: "dialogue_elder_chen_main"
#       function:
#         type: "quest_giver"
#         questLine: "main_story_act1"
#
# 依赖：物种编辑器（基础物种模板）、材质编辑器（外观覆盖纹理）
# 被引用方：场景编辑器（NPC 放置）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_character
  name: 角色编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "角色编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "在物种模板基础上创建具体的游戏角色（玩家角色、NPC、敌人）。物种定义了「什么生物」，角色定义了「这个生物是谁、做什么」。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
