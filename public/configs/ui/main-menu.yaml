# 主菜单页面配置
# 天蓝亮色风格

page:
  id: main_menu
  name: 主菜单
  type: fullscreen

# 根容器
container:
  width: "100%"
  height: "100%"
  background: transparent

# 组件列表
components:
  # 背景遮罩层
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(18, 32, 48, 0.90)"
      thickness: 0

  # 内容堆栈容器
  - id: contentStack
    type: stack
    parent: root
    layout:
      isVertical: true
      horizontalAlignment: center
      verticalAlignment: center
    children:
      # 游戏标题
      - id: title
        type: title
        text: "云笈仙田录"
        style:
          fontSize: 12
          color: "$textPrimary"
          shadowColor: "rgba(74, 155, 232, 0.5)"
          shadowBlur: 5
          height: "27px"

      # 副标题
      - id: subtitle
        type: subtitle
        text: "Cloud Scripture: Tale of the Immortal Farm"
        style:
          color: "$textSecondary"
          fontSize: 6
          height: "13px"

      # 间隔
      - id: spacer1
        type: spacer
        height: "17px"

      # 按钮组
      - id: buttonStack
        type: stack
        layout:
          isVertical: true
          spacing: 4
        children:
          - id: startBtn
            type: button
            text: "开始游戏"
            action: startGame
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnSuccess"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "#5AF08C"

          - id: continueBtn
            type: button
            text: "继续游戏"
            action: continueGame
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnPrimary"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "$primaryLight"

          - id: settingsBtn
            type: button
            text: "设置"
            action: openSettings
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnSecondary"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "#7A8FA5"

          - id: devBtn
            type: button
            text: "开发工具"
            action: openDevTools
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnWarning"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "#FFB84D"

          - id: exitBtn
            type: button
            text: "退出游戏"
            action: exitGame
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnDanger"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "#FF6B78"

  # 版本信息
  - id: version
    type: text
    text: "v0.1.0 - 早期开发版"
    layout:
      horizontalAlignment: right
      verticalAlignment: bottom
      right: "17px"
      bottom: "17px"
    style:
      color: "$textMuted"
      fontSize: 6

# 事件动作映射
actions:
  startGame:
    type: setState
    target: PLAYING

  continueGame:
    type: setState
    target: PLAYING

  openSettings:
    type: setState
    target: SETTINGS

  openDevTools:
    type: setState
    target: DEV_TOOLS

  exitGame:
    type: electronAPI
    method: close
