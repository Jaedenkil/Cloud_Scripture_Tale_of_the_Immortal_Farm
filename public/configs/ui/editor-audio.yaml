# ═══════════════════════════════════════════════════════════════
# 音效编辑器 (Audio Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第一层 · 基础资源
#
# 作用：
#   将音频资源配置为可触发的音效单元。
#   定义播放条件、音量曲线、空间衰减、随机变调范围。
#
# 核心功能：
#   - 音效配置：选择音频文件（引用资源管理器中的音频 ID）
#   - 触发模式：事件触发（交互/动作/破坏）、区域环境音、循环背景音
#   - 音量控制：基础音量、距离衰减曲线、最大听觉距离
#   - 变奏参数：随机音高偏移范围、随机音量偏移
#   - 空间化：3D 空间音效定位、立体声平衡
#   - 试听预览：直接在编辑器内播放音效
#
# 输出配置：configs/audio/*.yaml
#   格式示例：
#     sound:
#       id: "sfx_block_break_stone"
#       source: "sfx_stone_crack"        # 资源 ID
#       trigger: "event"                  # event | ambient | loop
#       volume: 0.8
#       pitchVariation: [-0.1, 0.1]
#       spatialize: true
#       maxDistance: 16
#       rolloff: "linear"
#
# 依赖：资源管理器（音频资源）
# 被引用方：物块编辑器、物种编辑器、天气编辑器、场景编辑器
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_audio
  name: 音效编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "音效编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "将音频资源配置为可触发的音效单元。定义播放条件、音量曲线、空间衰减、随机变调范围。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
