# ═══════════════════════════════════════════════════════════════
# 材质编辑器 (Material Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第一层 · 基础资源
#
# 作用：
#   将图片资源组合为可复用的材质定义。
#   配置漫反射贴图、法线贴图、发光贴图、透明度、UV 参数、混合模式。
#   一个材质可被物块、物种、物品等多处引用。
#
# 核心功能：
#   - 材质创建：选择基础贴图（引用资源管理器中的图片 ID）
#   - 贴图通道：配置漫反射、法线、高光、发光、透明度贴图
#   - UV 参数：平铺比例、偏移、旋转
#   - 混合模式：不透明、Alpha 测试、Alpha 混合、叠加
#   - 实时预览：3D 球体/立方体上预览材质效果
#
# 输出配置：configs/materials/*.yaml
#   格式示例：
#     material:
#       id: "mat_spiritual_stone"
#       diffuse: "tex_spiritual_stone"    # 资源 ID
#       normal: "tex_spiritual_stone_n"
#       emissive: "tex_spiritual_stone_e"
#       alpha: 1.0
#       uvScale: [1, 1]
#       blendMode: "opaque"
#
# 依赖：资源管理器（图片资源）
# 被引用方：物块编辑器、物种编辑器、物品编辑器、粒子编辑器
#
# ─── 模拟材质清单（UI 骨架阶段） ───
#
#   mat_spiritual_stone  灵石材质
#     diffuse: tex_spiritual_ore  normal: (无)  emissive: tex_spiritual_ore_e
#     alpha: 1.0  blendMode: opaque
#
#   mat_grass            草地材质
#     diffuse: tex_grass_top  normal: tex_grass_n  emissive: (无)
#     alpha: 1.0  blendMode: opaque
#
#   mat_water            流水材质
#     diffuse: tex_water_flow  normal: tex_water_n  emissive: (无)
#     alpha: 0.8  blendMode: alphaBlend
#
#   mat_wood             木板材质
#     diffuse: tex_wood_plank  normal: tex_wood_n  emissive: (无)
#     alpha: 1.0  blendMode: opaque
#
#   mat_farmland         灵田土壤
#     diffuse: tex_farmland_wet  normal: (无)  emissive: (无)
#     alpha: 1.0  blendMode: opaque
#
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_material
  name: 材质编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "材质编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "将图片资源组合为可复用的材质定义。配置漫反射贴图、法线贴图、发光贴图、透明度、UV 参数、混合模式，一个材质可被多处引用。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ═══════════════════════════════════════
      # 编辑器内容区域
      # 布局：左侧材质列表(100px) | 分隔线 | 中间属性面板 | 右侧预览(90px)
      # 参考：鬼谷八荒 的装备材质系统 + 原神 的角色材质面板
      # ═══════════════════════════════════════

      # ─────────── 左侧材质列表 ───────────
      - id: materialListPanel
        type: rectangle
        width: "110px"
        height: "240px"
        layout:
          top: "10px"
          left: "-255px"
        style:
          background: "rgba(30, 52, 78, 0.4)"
          cornerRadius: 4
          thickness: 1
          borderColor: "$border"
        children:
          - id: matListTitle
            type: text
            text: "材质列表"
            layout:
              top: "-108px"
            style:
              width: "100px"
              height: "12px"
              fontSize: 7
              color: "$textMuted"
              textAlign: center

          - id: newMatBtn
            type: button
            text: "+ 新建材质"
            action: newMaterial
            layout:
              top: "-93px"
            style:
              width: "95px"
              height: "15px"
              fontSize: 6
              cornerRadius: 2
              background: "$btnSuccess"
              color: "$btnTextAction"
              thickness: 0

          - id: matListStack
            type: stack
            layout:
              isVertical: true
              spacing: 2
              top: "-40px"
            style:
              width: "100px"
            children:
              - id: mat_item_1
                type: button
                text: "灵石材质"
                action: selectMat1
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(74, 155, 232, 0.2)"
                  color: "$textPrimary"
                  thickness: 1
                  borderColor: "$primary"

              - id: mat_item_2
                type: button
                text: "草地材质"
                action: selectMat2
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(50, 80, 115, 0.15)"
                  color: "$textSecondary"
                  thickness: 0

              - id: mat_item_3
                type: button
                text: "流水材质"
                action: selectMat3
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(50, 80, 115, 0.15)"
                  color: "$textSecondary"
                  thickness: 0

              - id: mat_item_4
                type: button
                text: "木板材质"
                action: selectMat4
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(50, 80, 115, 0.15)"
                  color: "$textSecondary"
                  thickness: 0

              - id: mat_item_5
                type: button
                text: "灵田土壤"
                action: selectMat5
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(50, 80, 115, 0.15)"
                  color: "$textSecondary"
                  thickness: 0

      # ─────────── 左侧垂直分隔线 ───────────
      - id: listDivider
        type: rectangle
        width: "$dividerHeight"
        height: "240px"
        layout:
          top: "10px"
          left: "-193px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 中间属性编辑面板 ───────────
      - id: propsPanel
        type: rectangle
        visible: false
        width: "280px"
        height: "240px"
        layout:
          top: "10px"
          left: "17px"
        style:
          background: transparent
          thickness: 0
        children:
          # --- 基础信息 ---
          - id: infoSection
            type: section
            label: "基础信息"
            layout:
              top: "-100px"
            style:
              width: "280px"
            children:
              - id: matIdDisplay
                type: dynamicText
                binding: "editor.material.selectedId"
                template: "ID: {value}"
                style:
                  width: "280px"
                  height: "10px"
                  fontSize: 6
                  color: "$textSecondary"
                  textAlign: left

              - id: matNameDisplay
                type: dynamicText
                binding: "editor.material.selectedName"
                template: "名称: {value}"
                style:
                  width: "280px"
                  height: "10px"
                  fontSize: 6
                  color: "$textPrimary"
                  textAlign: left

          # --- 贴图通道 ---
          - id: texSection
            type: section
            label: "贴图通道"
            layout:
              top: "-50px"
            style:
              width: "280px"
            children:
              - id: diffuseRow
                type: rectangle
                width: "280px"
                height: "14px"
                style:
                  background: transparent
                  thickness: 0
                children:
                  - id: diffuseLabel
                    type: text
                    text: "漫反射："
                    layout:
                      left: "-100px"
                    style:
                      width: "60px"
                      height: "14px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left
                  - id: diffuseValue
                    type: dynamicText
                    binding: "editor.material.diffuse"
                    template: "{value}"
                    layout:
                      left: "-10px"
                    style:
                      width: "100px"
                      height: "14px"
                      fontSize: 6
                      color: "$primary"
                      textAlign: left
                  - id: diffuseBtn
                    type: button
                    text: "选择"
                    action: pickDiffuse
                    layout:
                      left: "110px"
                    style:
                      width: "40px"
                      height: "13px"
                      fontSize: 5
                      cornerRadius: 2
                      background: "$btnSecondary"
                      color: "$btnTextNormal"
                      thickness: 0

              - id: normalRow
                type: rectangle
                width: "280px"
                height: "14px"
                style:
                  background: transparent
                  thickness: 0
                children:
                  - id: normalLabel
                    type: text
                    text: "法线："
                    layout:
                      left: "-100px"
                    style:
                      width: "60px"
                      height: "14px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left
                  - id: normalValue
                    type: dynamicText
                    binding: "editor.material.normal"
                    template: "{value}"
                    layout:
                      left: "-10px"
                    style:
                      width: "100px"
                      height: "14px"
                      fontSize: 6
                      color: "$primary"
                      textAlign: left
                  - id: normalBtn
                    type: button
                    text: "选择"
                    action: pickNormal
                    layout:
                      left: "110px"
                    style:
                      width: "40px"
                      height: "13px"
                      fontSize: 5
                      cornerRadius: 2
                      background: "$btnSecondary"
                      color: "$btnTextNormal"
                      thickness: 0

              - id: emissiveRow
                type: rectangle
                width: "280px"
                height: "14px"
                style:
                  background: transparent
                  thickness: 0
                children:
                  - id: emissiveLabel
                    type: text
                    text: "发光："
                    layout:
                      left: "-100px"
                    style:
                      width: "60px"
                      height: "14px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left
                  - id: emissiveValue
                    type: dynamicText
                    binding: "editor.material.emissive"
                    template: "{value}"
                    layout:
                      left: "-10px"
                    style:
                      width: "100px"
                      height: "14px"
                      fontSize: 6
                      color: "$primary"
                      textAlign: left
                  - id: emissiveBtn
                    type: button
                    text: "选择"
                    action: pickEmissive
                    layout:
                      left: "110px"
                    style:
                      width: "40px"
                      height: "13px"
                      fontSize: 5
                      cornerRadius: 2
                      background: "$btnSecondary"
                      color: "$btnTextNormal"
                      thickness: 0

          # --- 参数 ---
          - id: paramSection
            type: section
            label: "参数"
            layout:
              top: "25px"
            style:
              width: "280px"
            children:
              - id: alphaSlider
                type: slider
                label: "透明度"
                min: 0
                max: 100
                default: 100
                setting: "editor.material.alpha"

              - id: uvScaleXSlider
                type: slider
                label: "UV缩放X"
                min: 1
                max: 10
                default: 1
                setting: "editor.material.uvScaleX"

              - id: uvScaleYSlider
                type: slider
                label: "UV缩放Y"
                min: 1
                max: 10
                default: 1
                setting: "editor.material.uvScaleY"

          # --- 混合模式 ---
          - id: blendSection
            type: section
            label: "混合模式"
            layout:
              top: "100px"
            style:
              width: "280px"
            children:
              - id: blendSelector
                type: selector
                label: "模式"
                options:
                  - value: opaque
                    text: "不透明"
                  - value: alphaTest
                    text: "Alpha测试"
                  - value: alphaBlend
                    text: "Alpha混合"
                default: opaque
                setting: "editor.material.blendMode"

      # ─────────── 右侧垂直分隔线 ───────────
      - id: previewDivider
        type: rectangle
        width: "$dividerHeight"
        height: "240px"
        layout:
          top: "10px"
          left: "166px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 右侧预览面板 ───────────
      - id: previewPanel
        type: rectangle
        width: "130px"
        height: "240px"
        layout:
          top: "10px"
          left: "236px"
        style:
          background: "rgba(30, 52, 78, 0.3)"
          cornerRadius: 4
          thickness: 1
          borderColor: "$border"
        children:
          - id: previewTitle
            type: text
            text: "材质预览"
            layout:
              top: "-108px"
            style:
              width: "120px"
              height: "12px"
              fontSize: 7
              color: "$textMuted"
              textAlign: center

          - id: previewCanvas
            type: canvas
            width: "110px"
            height: "110px"
            renderer: "3D 球体预览"
            layout:
              top: "-40px"

          - id: previewModeLabel
            type: text
            text: "预览形状"
            layout:
              top: "35px"
            style:
              width: "120px"
              height: "10px"
              fontSize: 6
              color: "$textMuted"
              textAlign: center

          - id: shapeSelector
            type: selector
            label: ""
            options:
              - value: sphere
                text: "球体"
              - value: cube
                text: "立方"
              - value: plane
                text: "平面"
            default: sphere
            setting: "editor.material.previewShape"
            layout:
              top: "55px"
              left: "5px"

      # ─────────── 无选中提示 ───────────
      - id: noSelectionHint
        type: text
        text: "← 请从左侧列表选择一个材质进行编辑"
        layout:
          top: "10px"
          left: "60px"
        style:
          width: "300px"
          height: "20px"
          fontSize: 8
          color: "$textMuted"
          textAlign: center

      # ─────────── 底部状态栏 ───────────
      - id: statusBar
        type: rectangle
        width: "580px"
        height: "14px"
        layout:
          top: "163px"
        style:
          background: "rgba(50, 80, 115, 0.2)"
          thickness: 0
          cornerRadius: 2
        children:
          - id: statusText
            type: dynamicText
            binding: "editor.material.status"
            template: "{value}"
            style:
              width: "560px"
              height: "14px"
              fontSize: 6
              color: "$textMuted"
              textAlign: left

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip
  newMaterial:
    type: custom
    handler: materialNew
  selectMat1:
    type: custom
    handler: materialSelect
    params:
      index: 0
  selectMat2:
    type: custom
    handler: materialSelect
    params:
      index: 1
  selectMat3:
    type: custom
    handler: materialSelect
    params:
      index: 2
  selectMat4:
    type: custom
    handler: materialSelect
    params:
      index: 3
  selectMat5:
    type: custom
    handler: materialSelect
    params:
      index: 4
  pickDiffuse:
    type: custom
    handler: materialPickTexture
    params:
      channel: diffuse
  pickNormal:
    type: custom
    handler: materialPickTexture
    params:
      channel: normal
  pickEmissive:
    type: custom
    handler: materialPickTexture
    params:
      channel: emissive
  deleteResource:
    type: custom
    handler: materialDelete

keybindings:
  Escape:
    action: goBackToDevTools
