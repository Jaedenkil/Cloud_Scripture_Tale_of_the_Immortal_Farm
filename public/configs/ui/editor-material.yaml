# ═══════════════════════════════════════════════════════════════
# 材质编辑器 (Material Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第一层 · 基础资源
#
# 作用：
#   将图片资源组合为可复用的材质定义。
#   配置漫反射贴图、法线贴图、发光贴图、透明度、UV 参数、混合模式。
#   一个材质可被物块、物种、物品等多处引用。
#
# 核心功能：
#   - 材质创建：选择基础贴图（引用资源管理器中的图片 ID）
#   - 贴图通道：配置漫反射、法线、高光、发光、透明度贴图
#   - UV 参数：平铺比例、偏移、旋转
#   - 混合模式：不透明、Alpha 测试、Alpha 混合、叠加
#   - 实时预览：3D 球体/立方体上预览材质效果
#
# 输出配置：configs/materials/*.yaml
#   格式示例：
#     material:
#       id: "mat_spiritual_stone"
#       diffuse: "tex_spiritual_stone"    # 资源 ID
#       normal: "tex_spiritual_stone_n"
#       emissive: "tex_spiritual_stone_e"
#       alpha: 1.0
#       uvScale: [1, 1]
#       blendMode: "opaque"
#
# 依赖：资源管理器（图片资源）
# 被引用方：物块编辑器、物种编辑器、物品编辑器、粒子编辑器
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_material
  name: 材质编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "材质编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "将图片资源组合为可复用的材质定义。配置漫反射贴图、法线贴图、发光贴图、透明度、UV 参数、混合模式，一个材质可被多处引用。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
