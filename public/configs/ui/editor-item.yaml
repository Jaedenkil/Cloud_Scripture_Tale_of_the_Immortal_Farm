# ═══════════════════════════════════════════════════════════════
# 物品编辑器 (Item Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第二层 · 内容构件
#
# 作用：
#   定义游戏中所有可持有的物品，包括工具、武器、防具、消耗品、
#   灵植种子、收获物、炼丹材料等。
#   灵植作为特殊物品子类型，包含完整的生长周期配置。
#
# 核心功能：
#   - 基础属性：物品名称、图标纹理（引用材质）、堆叠上限、稀有度
#   - 物品分类：工具(tool)、武器(weapon)、防具(armor)、
#     消耗品(consumable)、种子(seed)、材料(material)、杂物(misc)
#   - 装备属性：攻击力、防御力、攻击速度、耐久度
#   - 消耗效果：灵力回复量、生命回复、增益效果及持续时间
#   - 灵植配置（seed 子类型专属）：
#     · 生长阶段：种子 → 幼苗 → 成长 → 成熟 → 枯萎
#     · 每阶段外观：对应不同的方块或模型纹理
#     · 生长周期：每阶段所需时间（受天气/灵力影响）
#     · 收获产出：果实物品 ID 及数量范围
#     · 适宜群落：温度/湿度适宜范围（影响生长速度）
#   - 图标预览：在编辑器中显示物品图标
#
# 输出配置：configs/items/*.yaml
#   格式示例：
#     item:
#       id: "spirit_herb_seed"
#       name: "聚灵草种子"
#       type: "seed"
#       icon: "mat_icon_spirit_herb_seed"
#       stackLimit: 64
#       rarity: "common"
#       plant:
#         stages:
#           - name: "种子"
#             duration: 0         # 立即进入下一阶段
#             appearance: "block_seed_planted"
#           - name: "幼苗"
#             duration: 120       # 游戏时间 tick
#             appearance: "block_spirit_herb_sprout"
#           - name: "成熟"
#             duration: 240
#             appearance: "block_spirit_herb_mature"
#           - name: "枯萎"
#             duration: 480
#             appearance: "block_spirit_herb_wilted"
#         harvest:
#           item: "spirit_herb"
#           count: [1, 3]
#           seedReturn: 0.5      # 50% 概率返还种子
#         climate:
#           temperature: [15, 30]
#           humidity: [0.4, 0.8]
#
# 依赖：材质编辑器（图标和外观纹理）
# 被引用方：物块编辑器（掉落物）、角色编辑器（商品列表）、群落编辑器（植被分布）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_item
  name: 物品编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "物品编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义游戏中所有可持有的物品（工具、武器、防具、消耗品、灵植种子、收获物、炼丹材料等）。灵植作为特殊物品子类型，包含完整生长周期配置。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
