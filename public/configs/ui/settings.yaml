# 设置页面配置
# 参考：原神设置 — 全屏遮罩，居中面板，左侧导航 + 右侧内容
# 坐标系：Babylon.js GUI 以父容器中心为原点 (0,0)
# 虚拟分辨率 640×360，中心 (0,0)，上=-180，下=+180，左=-320，右=+320
#
# 内容组垂直布局（总高约 198px，居中）：
#   headerArea(~48px) + gap(5) + headerDivider(1) + gap(8)
#   + 内容行(100px) + gap(8) + footerDivider(1) + gap(8)
#   + actionBar(~19px)
# 起始 Y = -198/2 = -99

page:
  id: settings
  name: 设置
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  # 背景遮罩（全屏半透明）
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  # ═══════════════════════════════════════
  # 主面板（全屏，所有子元素从中心定位）
  # ═══════════════════════════════════════
  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:

      # ─────────── 标题区域 ───────────
      # headerArea auto-height ≈ 48px (title 34 + spacing 2 + sub 12)
      # 中心 Y = -99 + 24 = -75
      - id: headerArea
        type: stack
        layout:
          isVertical: true
          spacing: 2
          top: "-135px"
        style:
          width: "100%"
        children:
          - id: settingsTitle
            type: title
            text: "设　置"
            style:
              width: "100%"
              height: "$titleLargeHeight"
              fontSize: "$titleLarge"
              color: "$textPrimary"
              textAlign: center
              shadowColor: "rgba(74, 155, 232, 0.35)"
              shadowBlur: 3

          - id: settingsSub
            type: text
            text: "S E T T I N G S"
            style:
              width: "100%"
              height: "$textSmallHeight"
              fontSize: "$textSmall"
              color: "$textMuted"
              textAlign: center

      # ─────────── 标题下分隔线 ───────────
      # 中心 Y = -99 + 48 + 5 + 0.5 = -46
      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-96px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 左侧导航栏 ───────────
      # 内容行中心 Y = -99 + 48 + 5 + 1 + 8 + 50 = 13
      # 水平：总行宽 273px (64+12+1+8+188)，行左边缘 = -136.5
      # sideNav(64px) 中心 X = -136.5 + 32 ≈ -105
      # sideNav auto-height ≈ 67px (label 12 + 3×btn 16 + 3×spacing 3)
      - id: sideNav
        type: stack
        layout:
          isVertical: true
          spacing: 3
          top: "13px"
          left: "-255px"
        style:
          width: "64px"
        children:
          - id: tabAudio
            type: button
            text: "音频"
            action: switchToAudio
            style:
              width: "64px"
              height: "16px"
              background: "$btnPrimary"
              color: "$btnTextNormal"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              thickness: "$buttonBorderWidth"
              borderColor: "$primaryLight"

          - id: tabGraphics
            type: button
            text: "画面"
            action: switchToGraphics
            style:
              width: "64px"
              height: "16px"
              background: "rgba(50, 80, 115, 0.35)"
              color: "$textSecondary"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              thickness: "$buttonBorderWidth"
              borderColor: "$border"

          - id: tabLanguage
            type: button
            text: "语言"
            action: switchToLanguage
            style:
              width: "64px"
              height: "16px"
              background: "rgba(50, 80, 115, 0.35)"
              color: "$textSecondary"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              thickness: "$buttonBorderWidth"
              borderColor: "$border"

      # ─────────── 垂直分隔线 ───────────
      # 中心 X = -136.5 + 64 + 12 + 0.5 ≈ -60
      - id: navDivider
        type: rectangle
        width: "$dividerHeight"
        height: "200px"
        layout:
          top: "13px"
          left: "-200px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 右侧内容区域 ───────────
      # 中心 X = -136.5 + 64 + 12 + 1 + 8 + 94 ≈ 43
      - id: contentArea
        type: rectangle
        width: "188px"
        height: "100px"
        layout:
          top: "13px"
          left: "43px"
        style:
          background: transparent
          thickness: 0
        children:
          # 音频设置（默认显示）
          - id: audioContent
            type: stack
            visible: true
            layout:
              isVertical: true
              spacing: 7
            style:
              width: "100%"
            children:
              - id: masterVolumeSlider
                type: slider
                label: "主音量"
                min: 0
                max: 100
                default: 80
                setting: masterVolume

              - id: musicVolumeSlider
                type: slider
                label: "音乐音量"
                min: 0
                max: 100
                default: 60
                setting: musicVolume

              - id: sfxVolumeSlider
                type: slider
                label: "音效音量"
                min: 0
                max: 100
                default: 80
                setting: sfxVolume

          # 画面设置（默认隐藏）
          - id: graphicsContent
            type: stack
            visible: false
            layout:
              isVertical: true
              spacing: 7
            style:
              width: "100%"
            children:
              - id: qualitySelector
                type: selector
                label: "画质等级"
                setting: quality
                default: "high"
                options:
                  - value: "low"
                    text: "低"
                  - value: "medium"
                    text: "中"
                  - value: "high"
                    text: "高"

              - id: fullscreenToggle
                type: toggle
                label: "全屏模式"
                setting: fullscreen
                default: false

              - id: vsyncToggle
                type: toggle
                label: "垂直同步"
                setting: vsync
                default: true

          # 语言设置（默认隐藏）
          - id: languageContent
            type: stack
            visible: false
            layout:
              isVertical: true
              spacing: 7
            style:
              width: "100%"
            children:
              - id: languageSelector
                type: selector
                label: "界面语言"
                setting: language
                default: "zh-CN"
                options:
                  - value: "zh-CN"
                    text: "简体中文"
                  - value: "zh-TW"
                    text: "繁體中文"
                  - value: "en-US"
                    text: "English"

              - id: subtitleToggle
                type: toggle
                label: "显示字幕"
                setting: showSubtitle
                default: true

      # ─────────── 底部分隔线 ───────────
      # 中心 Y = -99 + 48 + 5 + 1 + 8 + 100 + 8 + 0.5 = 72
      - id: footerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "122px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 操作按钮栏 ───────────
      # 中心 Y = -99 + 48 + 5 + 1 + 8 + 100 + 8 + 1 + 8 + 9.5 = 90
      - id: actionBar
        type: stack
        layout:
          isVertical: false
          spacing: 10
          top: "140px"
        style:
          height: "19px"
        children:
          - id: cancelBtn
            type: button
            text: "取消"
            action: cancelSettings
            style:
              width: "53px"
              height: "17px"
              background: "$btnNeutral"
              color: "$btnTextAction"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              thickness: "$buttonBorderWidth"
              borderColor: "#7A8290"

          - id: applyBtn
            type: button
            text: "保存并返回"
            action: applySettings
            style:
              width: "67px"
              height: "17px"
              background: "$btnSuccess"
              color: "$btnTextAction"
              fontSize: "$buttonFontSize"
              cornerRadius: "$buttonCornerRadius"
              thickness: "$buttonBorderWidth"
              borderColor: "#5AF08C"

actions:
  switchToAudio:
    type: custom
    handler: switchToAudio

  switchToGraphics:
    type: custom
    handler: switchToGraphics

  switchToLanguage:
    type: custom
    handler: switchToLanguage

  applySettings:
    type: saveSettings

  cancelSettings:
    type: goBack

keybindings:
  Escape:
    action: cancelSettings
