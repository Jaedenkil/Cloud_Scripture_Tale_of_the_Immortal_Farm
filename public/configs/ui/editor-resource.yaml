# ═══════════════════════════════════════════════════════════════
# 资源管理器 (Resource Manager)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第一层 · 基础资源
#
# 作用：
#   导入、预览、分类管理本地静态资源文件（图片、音频、模型）。
#   为每个资源分配唯一 ID，标注类型（texture/audio/model）和标签。
#   所有其他编辑器通过资源 ID 引用文件，不直接引用文件路径。
#
# 核心功能：
#   - 资源导入：通过 Electron 文件对话框选择本地图片/音频/模型文件
#   - 资源预览：图片缩略图、音频波形/播放、模型 3D 预览
#   - 分类管理：按类型/标签/用途筛选和搜索
#   - 资源清单：自动维护资源 ID → 文件路径的映射关系
#
# 输出配置：configs/resources/manifest.yaml
#   格式示例：
#     resources:
#       - id: "tex_grass_top"
#         type: texture
#         path: "assets/textures/blocks/grass_top.png"
#         tags: ["block", "grass", "natural"]
#       - id: "sfx_step_stone"
#         type: audio
#         path: "assets/audio/sfx/step_stone.ogg"
#         tags: ["footstep", "stone"]
#
# 被引用方：材质编辑器、音效编辑器（及所有下游编辑器间接引用）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_resource
  name: 资源管理器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "资源管理器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "导入、预览、分类管理本地静态资源文件（图片、音频、模型）。为每个资源分配唯一 ID，标注类型和标签，所有其他编辑器通过资源 ID 引用文件。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
