# 暂停菜单配置

page:
  id: pause_menu
  name: 暂停菜单
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: "rgba(0, 0, 0, 0.7)"

components:
  # 主面板
  - id: mainPanel
    type: panel
    width: "140px"
    height: "auto"
    layout:
      horizontalAlignment: center
      verticalAlignment: center
    style:
      background: "$bgDark"
      cornerRadius: 4
      thickness: 1
      borderColor: "$border"
      padding: "17px"
    children:
      # 标题
      - id: title
        type: title
        text: "游戏暂停"
        style:
          fontSize: 12
          color: "$textPrimary"
          height: "20px"

      # 分隔线
      - id: pauseDivider
        type: rectangle
        width: "100%"
        height: "1px"
        style:
          background: "$divider"
          thickness: 0

      # 间隔
      - id: spacerAfterDivider
        type: spacer
        height: "7px"

      # 按钮组
      - id: buttonStack
        type: stack
        layout:
          isVertical: true
          spacing: 4
        children:
          - id: resumeBtn
            type: button
            text: "继续游戏"
            action: resume
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnSuccess"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "#5AF08C"

          - id: settingsBtn
            type: button
            text: "设置"
            action: openSettings
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnPrimary"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "$primaryLight"

          - id: saveBtn
            type: button
            text: "保存游戏"
            action: saveGame
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnSecondary"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "#7A8FA5"

          - id: mainMenuBtn
            type: button
            text: "返回主菜单"
            action: goMainMenu
            style:
              width: "93px"
              height: "19px"
              fontSize: 8
              background: "$btnDanger"
              color: "$btnTextAction"
              cornerRadius: 3
              thickness: 1
              borderColor: "#FF6B78"

      # 间隔
      - id: spacerBeforeHint
        type: spacer
        height: "7px"

      # 提示文字
      - id: hint
        type: text
        text: "按 ESC 继续游戏"
        style:
          color: "$textMuted"
          fontSize: 6
          horizontalAlignment: center

actions:
  resume:
    type: setState
    target: PLAYING

  openSettings:
    type: setState
    target: SETTINGS

  saveGame:
    type: custom
    handler: saveGame

  goMainMenu:
    type: setState
    target: MAIN_MENU
