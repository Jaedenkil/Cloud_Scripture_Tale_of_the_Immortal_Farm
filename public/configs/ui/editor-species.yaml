      - id: statusBar
        type: rectangle
        width: "580px"
        height: "14px"
        layout:
          top: "163px"
        style:
          background: "rgba(50, 80, 115, 0.2)"
          thickness: 0
          cornerRadius: 2
        children:
          - id: statusText
            type: dynamicText
            binding: "editor.species.status"
            template: "{value}"
            style:
              width: "560px"
              height: "14px"
              fontSize: 6
              color: "$textMuted"
              textAlign: left

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

  # 物种选择
  selectSp1:
    type: custom
    handler: speciesSelect
    params:
      index: 0
  selectSp2:
    type: custom
    handler: speciesSelect
    params:
      index: 1
  selectSp3:
    type: custom
    handler: speciesSelect
    params:
      index: 2
  selectSp4:
    type: custom
    handler: speciesSelect
    params:
      index: 3

  # 新建物种
  speciesNew:
    type: custom
    handler: speciesNew

  # Tab 切换
  switchTabSkeleton:
    type: custom
    handler: speciesSwitchTab
    params:
      tab: skeleton
  switchTabAnimation:
    type: custom
    handler: speciesSwitchTab
    params:
      tab: animation
  switchTabTexture:
    type: custom
    handler: speciesSwitchTab
    params:
      tab: texture
  switchTabCollider:
    type: custom
    handler: speciesSwitchTab
    params:
      tab: collider
  switchTabAttributes:
    type: custom
    handler: speciesSwitchTab
    params:
      tab: attributes
  switchTabSound:
    type: custom
    handler: speciesSwitchTab
    params:
      tab: sound

  # 纹理选择
  pickTexDiffuse:
    type: custom
    handler: speciesPickTexture
    params:
      channel: diffuse
  pickTexNormal:
    type: custom
    handler: speciesPickTexture
    params:
      channel: normal
  pickTexEmissive:
    type: custom
    handler: speciesPickTexture
    params:
      channel: emissive

  # 音效选择
  pickSndFootstep:
    type: custom
    handler: speciesPickSound
    params:
      channel: footstep
  pickSndVoice:
    type: custom
    handler: speciesPickSound
    params:
      channel: voice
  pickSndHurt:
    type: custom
    handler: speciesPickSound
    params:
      channel: hurt

  # Spine 预览控制
  toggleSpineDebug:
    type: custom
    handler: spineToggleDebug
  importSpineAsset:
    type: custom
    handler: spineImportAsset
  cycleSpineAnim:
    type: custom
    handler: spineCycleAnim

keybindings:
  Escape:
    action: goBackToDevTools
