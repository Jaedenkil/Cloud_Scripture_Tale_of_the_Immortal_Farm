# ═══════════════════════════════════════════════════════════════
# 物种编辑器 (Species Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第二层 · 内容构件
#
# 作用：
#   定义游戏中所有生物的物理形态模板。
#   物种是角色和 NPC 的基础——先有物种（骨骼+外观+能力），再有具体角色。
#   不同模板等级提供不同的属性加成（如精英模板力量×1.5，普通模板×1.0）。
#
# 核心功能：
#   - 骨架编辑：定义骨骼节点树（头/躯干/上臂/前臂/手/大腿/小腿/脚的
#     层级关系、初始位置、旋转轴约束）
#   - 骨架动画：为每个骨骼节点编辑关键帧序列，内置动画类型：
#     行走(walk)、休息(idle)、奔跑(run)、攻击(attack)、
#     受击(hurt)、死亡(death)、采集(gather)、跳跃(jump)
#   - 基础纹理：将材质贴图映射到骨骼网格（引用材质编辑器输出）
#   - 碰撞体积：包围盒尺寸（宽/高/深）、碰撞偏移
#   - 属性加成模板：定义物种等级和对应的属性倍率
#     例：普通人类 → 力量×1.0/敏捷×1.0
#         精英妖兽 → 力量×1.5/攻击×1.5/生命×2.0
#         远古灵禽 → 敏捷×2.0/灵力×1.8
#   - 音效绑定：脚步声、叫声/语音、受伤音效（引用音效编辑器输出）
#   - 3D 预览：在编辑器中实时预览骨架结构和动画播放
#
# 输出配置：configs/species/*.yaml
#   格式示例：
#     species:
#       id: "human_base"
#       name: "人族"
#       skeleton:
#         root:
#           - bone: "spine"
#             position: [0, 0.5, 0]
#             children:
#               - bone: "head"
#                 position: [0, 0.6, 0]
#               - bone: "arm_left"
#                 position: [-0.3, 0.5, 0]
#               - bone: "arm_right"
#                 position: [0.3, 0.5, 0]
#           - bone: "leg_left"
#             position: [-0.15, 0, 0]
#           - bone: "leg_right"
#             position: [0.15, 0, 0]
#       animations:
#         idle:
#           duration: 2.0
#           loop: true
#           keyframes: [...]
#         walk:
#           duration: 0.8
#           loop: true
#           keyframes: [...]
#       texture: "mat_human_skin_base"
#       collider: { width: 0.6, height: 1.8, depth: 0.6 }
#       templates:
#         normal:
#           strength: 1.0
#           agility: 1.0
#           spirit: 1.0
#           health: 100
#         elite:
#           strength: 1.5
#           agility: 1.2
#           spirit: 1.3
#           health: 200
#       sounds:
#         footstep: "sfx_step_human"
#         hurt: "sfx_hurt_human"
#
# 依赖：材质编辑器（骨骼纹理）、音效编辑器（生物音效）
# 被引用方：角色编辑器（创建具体角色）、群落编辑器（生物生成表）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_species
  name: 物种编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "物种编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义游戏中所有生物的物理形态模板。物种是角色和 NPC 的基础——先有物种（骨骼+外观+能力），再有具体角色。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域 ───────────
      # 布局：左侧物种列表(110px) | 分隔线 | 右侧 Tab + 属性面板
      # 参考：鬼谷八荒 角色面板 Tab 分页 + Blockbench 属性编辑

      # ─────────── 左侧物种列表 ───────────
      - id: speciesListPanel
        type: rectangle
        width: "110px"
        height: "240px"
        layout:
          top: "10px"
          left: "-255px"
        style:
          background: "rgba(30, 52, 78, 0.4)"
          cornerRadius: 4
          thickness: 1
          borderColor: "$border"
        children:
          - id: speciesListTitle
            type: text
            text: "物种列表"
            layout:
              top: "-108px"
            style:
              width: "100px"
              height: "12px"
              fontSize: 7
              color: "$textMuted"
              textAlign: center

          - id: newSpeciesBtn
            type: button
            text: "+ 新建物种"
            action: speciesNew
            layout:
              top: "-93px"
            style:
              width: "95px"
              height: "15px"
              fontSize: 6
              cornerRadius: 2
              background: "$btnSuccess"
              color: "$btnTextAction"
              thickness: 0

          - id: speciesListStack
            type: stack
            layout:
              isVertical: true
              spacing: 2
              top: "-40px"
            style:
              width: "100px"
            children:
              - id: sp_item_1
                type: button
                text: "人族"
                action: selectSp1
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(74, 155, 232, 0.2)"
                  color: "$textPrimary"
                  thickness: 1
                  borderColor: "$primary"

              - id: sp_item_2
                type: button
                text: "灵狐"
                action: selectSp2
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(50, 80, 115, 0.15)"
                  color: "$textSecondary"
                  thickness: 0

              - id: sp_item_3
                type: button
                text: "岩傀儡"
                action: selectSp3
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(50, 80, 115, 0.15)"
                  color: "$textSecondary"
                  thickness: 0

              - id: sp_item_4
                type: button
                text: "仙鹤"
                action: selectSp4
                style:
                  width: "100px"
                  height: "15px"
                  fontSize: 6
                  cornerRadius: 2
                  background: "rgba(50, 80, 115, 0.15)"
                  color: "$textSecondary"
                  thickness: 0

      # ─────────── 左侧垂直分隔线 ───────────
      - id: listDivider
        type: rectangle
        width: "$dividerHeight"
        height: "240px"
        layout:
          top: "10px"
          left: "-193px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── Tab 栏 ───────────
      - id: tabBar
        type: stack
        layout:
          isVertical: false
          spacing: 3
          top: "-115px"
          left: "57px"
        style:
          height: "16px"
        children:
          - id: tabSkeleton
            type: button
            text: "骨架"
            action: switchTabSkeleton
            style:
              width: "55px"
              height: "16px"
              fontSize: 6
              cornerRadius: 2
              background: "$btnPrimary"
              color: "$textPrimary"
              thickness: 1
              borderColor: "$primaryLight"

          - id: tabAnimation
            type: button
            text: "动画"
            action: switchTabAnimation
            style:
              width: "55px"
              height: "16px"
              fontSize: 6
              cornerRadius: 2
              background: "rgba(50, 80, 115, 0.35)"
              color: "$textSecondary"
              thickness: 0

          - id: tabTexture
            type: button
            text: "纹理"
            action: switchTabTexture
            style:
              width: "55px"
              height: "16px"
              fontSize: 6
              cornerRadius: 2
              background: "rgba(50, 80, 115, 0.35)"
              color: "$textSecondary"
              thickness: 0

          - id: tabCollider
            type: button
            text: "碰撞"
            action: switchTabCollider
            style:
              width: "55px"
              height: "16px"
              fontSize: 6
              cornerRadius: 2
              background: "rgba(50, 80, 115, 0.35)"
              color: "$textSecondary"
              thickness: 0

          - id: tabAttributes
            type: button
            text: "属性"
            action: switchTabAttributes
            style:
              width: "55px"
              height: "16px"
              fontSize: 6
              cornerRadius: 2
              background: "rgba(50, 80, 115, 0.35)"
              color: "$textSecondary"
              thickness: 0

          - id: tabSound
            type: button
            text: "音效"
            action: switchTabSound
            style:
              width: "55px"
              height: "16px"
              fontSize: 6
              cornerRadius: 2
              background: "rgba(50, 80, 115, 0.35)"
              color: "$textSecondary"
              thickness: 0

      # ═══════════════════════════════════════
      # Tab 内容面板（visible 切换）
      # 右侧区域：left: 57px, 宽度 ~350px, 高度 ~210px
      # ═══════════════════════════════════════

      # ─────────── 骨架 Tab ───────────
      - id: contentSkeleton
        type: rectangle
        visible: false
        width: "350px"
        height: "210px"
        layout:
          top: "20px"
          left: "57px"
        style:
          background: transparent
          thickness: 0
        children:
          # 左半：骨骼节点树
          - id: boneTreePanel
            type: rectangle
            width: "170px"
            height: "200px"
            layout:
              left: "-88px"
            style:
              background: "rgba(30, 52, 78, 0.3)"
              cornerRadius: 4
              thickness: 1
              borderColor: "$border"
            children:
              - id: boneTreeTitle
                type: text
                text: "骨骼节点树"
                layout:
                  top: "-90px"
                style:
                  width: "160px"
                  height: "12px"
                  fontSize: 7
                  color: "$textMuted"
                  textAlign: center

              - id: boneTreeStack
                type: stack
                layout:
                  isVertical: true
                  spacing: 1
                  top: "-50px"
                style:
                  width: "155px"
                children:
                  - id: bone_root
                    type: text
                    text: "▼ root"
                    style:
                      width: "155px"
                      height: "11px"
                      fontSize: 6
                      color: "$warning"
                      textAlign: left

                  - id: bone_spine
                    type: text
                    text: "  ▼ spine [0, 0.5, 0]"
                    style:
                      width: "155px"
                      height: "11px"
                      fontSize: 6
                      color: "$textPrimary"
                      textAlign: left

                  - id: bone_head
                    type: text
                    text: "    · head [0, 0.6, 0]"
                    style:
                      width: "155px"
                      height: "11px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left

                  - id: bone_arm_l
                    type: text
                    text: "    · arm_left [-0.3, 0.5, 0]"
                    style:
                      width: "155px"
                      height: "11px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left

                  - id: bone_arm_r
                    type: text
                    text: "    · arm_right [0.3, 0.5, 0]"
                    style:
                      width: "155px"
                      height: "11px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left

                  - id: bone_leg_l
                    type: text
                    text: "  · leg_left [-0.15, 0, 0]"
                    style:
                      width: "155px"
                      height: "11px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left

                  - id: bone_leg_r
                    type: text
                    text: "  · leg_right [0.15, 0, 0]"
                    style:
                      width: "155px"
                      height: "11px"
                      fontSize: 6
                      color: "$textSecondary"
                      textAlign: left

          # 右半：Spine 骨骼预览
          - id: skeletonPreviewPanel
            type: rectangle
            width: "170px"
            height: "200px"
            layout:
              left: "88px"
            style:
              background: "rgba(30, 52, 78, 0.3)"
              cornerRadius: 4
              thickness: 1
              borderColor: "$border"
            children:
              - id: previewTitle
                type: text
                text: "Spine 预览"
                layout:
                  top: "-90px"
                style:
                  width: "160px"
                  height: "12px"
                  fontSize: 7
                  color: "$textMuted"
                  textAlign: center

              # Spine 渲染占位区域（SpinePreview 将 attach 到此控件）
              - id: spinePreviewArea
                type: rectangle
                width: "160px"
                height: "150px"
                layout:
                  top: "-10px"
                style:
                  background: "rgba(18, 32, 48, 1.0)"
                  cornerRadius: 3
                  thickness: 1
                  borderColor: "rgba(74, 155, 232, 0.2)"

              # 底部控制条
              - id: spineControls
                type: stack
                layout:
                  isVertical: false
                  spacing: 3
                  top: "85px"
                style:
                  height: "14px"
                children:
                  - id: spineDebugBtn
                    type: button
                    text: "骨骼线"
                    action: toggleSpineDebug
                    style:
                      width: "45px"
                      height: "14px"
                      fontSize: 5
                      cornerRadius: 2
                      background: "rgba(74, 155, 232, 0.3)"
                      color: "$textSecondary"
                      thickness: 0
                  - id: spineImportBtn
                    type: button
                    text: "导入 Spine"
                    action: importSpineAsset
                    style:
                      width: "58px"
                      height: "14px"
                      fontSize: 5
                      cornerRadius: 2
                      background: "$btnSuccess"
                      color: "$btnTextAction"
                      thickness: 0
                  - id: spineAnimSelector
                    type: button
                    text: "▶ idle"
                    action: cycleSpineAnim
                    style:
                      width: "45px"
                      height: "14px"
                      fontSize: 5
                      cornerRadius: 2
                      background: "rgba(50, 80, 115, 0.35)"
                      color: "$textSecondary"
                      thickness: 0

      # ─────────── 动画 Tab ───────────
      - id: contentAnimation
        type: rectangle
        visible: false
        width: "350px"
        height: "210px"
        layout:
          top: "20px"
          left: "57px"
        style:
          background: transparent
          thickness: 0
        children:
          - id: animListPanel
            type: rectangle
            width: "340px"
            height: "200px"
            style:
              background: "rgba(30, 52, 78, 0.3)"
              cornerRadius: 4
              thickness: 1
              borderColor: "$border"
            children:
              - id: animTitle
                type: text
                text: "动画类型列表"
                layout:
                  top: "-90px"
                style:
                  width: "320px"
                  height: "12px"
                  fontSize: 7
                  color: "$textMuted"
                  textAlign: center

              # 表头
              - id: animHeader
                type: rectangle
                width: "320px"
                height: "12px"
                layout:
                  top: "-74px"
                style:
                  background: "rgba(74, 155, 232, 0.1)"
                  thickness: 0
                children:
                  - id: animH_type
                    type: text
                    text: "类型"
                    layout:
                      left: "-120px"
                    style:
                      width: "60px"
                      height: "12px"
                      fontSize: 6
                      color: "$textMuted"
                      textAlign: left
                  - id: animH_name
                    type: text
                    text: "名称"
                    layout:
                      left: "-40px"
                    style:
                      width: "70px"
                      height: "12px"
                      fontSize: 6
                      color: "$textMuted"
                      textAlign: left
                  - id: animH_dur
                    type: text
                    text: "时长"
                    layout:
                      left: "50px"
                    style:
                      width: "50px"
                      height: "12px"
                      fontSize: 6
                      color: "$textMuted"
                      textAlign: center
                  - id: animH_loop
                    type: text
                    text: "循环"
                    layout:
                      left: "120px"
                    style:
                      width: "40px"
                      height: "12px"
                      fontSize: 6
                      color: "$textMuted"
                      textAlign: center

              # 动画行
              - id: animRows
                type: stack
                layout:
                  isVertical: true
                  spacing: 1
                  top: "-35px"
                style:
                  width: "320px"
                children:
                  - id: anim_idle
                    type: rectangle
                    width: "320px"
                    height: "13px"
                    style:
                      background: "rgba(50, 80, 115, 0.15)"
                      thickness: 0
                    children:
                      - id: anim_idle_type
                        type: text
                        text: "idle"
                        layout:
                          left: "-120px"
                        style:
                          width: "60px"
                          height: "13px"
                          fontSize: 6
                          color: "$primary"
                          textAlign: left
                      - id: anim_idle_name
                        type: text
                        text: "休息"
                        layout:
                          left: "-40px"
                        style:
                          width: "70px"
                          height: "13px"
                          fontSize: 6
                          color: "$textPrimary"
                          textAlign: left
                      - id: anim_idle_dur
                        type: text
                        text: "2.0s"
                        layout:
                          left: "50px"
                        style:
                          width: "50px"
                          height: "13px"
                          fontSize: 6
                          color: "$textSecondary"
                          textAlign: center
                      - id: anim_idle_loop
                        type: text
                        text: "✓"
                        layout:
                          left: "120px"
                        style:
                          width: "40px"
                          height: "13px"
                          fontSize: 6
                          color: "$success"
                          textAlign: center

                  - id: anim_walk
                    type: rectangle
                    width: "320px"
                    height: "13px"
                    style:
                      background: "rgba(50, 80, 115, 0.08)"
                      thickness: 0
                    children:
                      - id: anim_walk_type
                        type: text
                        text: "walk"
                        layout:
                          left: "-120px"
                        style:
                          width: "60px"
                          height: "13px"
                          fontSize: 6
                          color: "$primary"
                          textAlign: left
                      - id: anim_walk_name
                        type: text
                        text: "行走"
                        layout:
                          left: "-40px"
                        style:
                          width: "70px"
                          height: "13px"
                          fontSize: 6
                          color: "$textPrimary"
                          textAlign: left
                      - id: anim_walk_dur
                        type: text
                        text: "0.8s"
                        layout:
                          left: "50px"
                        style:
                          width: "50px"
                          height: "13px"
                          fontSize: 6
                          color: "$textSecondary"
                          textAlign: center
                      - id: anim_walk_loop
                        type: text
                        text: "✓"
                        layout:
                          left: "120px"
                        style:
                          width: "40px"
                          height: "13px"
                          fontSize: 6
                          color: "$success"
                          textAlign: center

                  - id: anim_run
                    type: rectangle
                    width: "320px"
                    height: "13px"
                    style:
                      background: "rgba(50, 80, 115, 0.15)"
                      thickness: 0
                    children:
                      - id: anim_run_type
                        type: text
                        text: "run"
                        layout:
                          left: "-120px"
                        style:
                          width: "60px"
                          height: "13px"
                          fontSize: 6
                          color: "$primary"
                          textAlign: left
                      - id: anim_run_name
                        type: text
                        text: "奔跑"
                        layout:
                          left: "-40px"
                        style:
                          width: "70px"
                          height: "13px"
                          fontSize: 6
                          color: "$textPrimary"
                          textAlign: left
                      - id: anim_run_dur
                        type: text
                        text: "0.6s"
                        layout:
                          left: "50px"
                        style:
                          width: "50px"
                          height: "13px"
                          fontSize: 6
                          color: "$textSecondary"
                          textAlign: center
                      - id: anim_run_loop
                        type: text
                        text: "✓"
                        layout:
                          left: "120px"
                        style:
                          width: "40px"
                          height: "13px"
                          fontSize: 6
                          color: "$success"
                          textAlign: center

                  - id: anim_attack
                    type: rectangle
                    width: "320px"
                    height: "13px"
                    style:
                      background: "rgba(50, 80, 115, 0.08)"
                      thickness: 0
                    children:
                      - id: anim_attack_type
                        type: text
                        text: "attack"
                        layout:
                          left: "-120px"
                        style:
                          width: "60px"
                          height: "13px"
                          fontSize: 6
                          color: "$primary"
                          textAlign: left
                      - id: anim_attack_name
                        type: text
                        text: "攻击"
                        layout:
                          left: "-40px"
                        style:
                          width: "70px"
                          height: "13px"
                          fontSize: 6
                          color: "$textPrimary"
                          textAlign: left
                      - id: anim_attack_dur
                        type: text
                        text: "0.5s"
                        layout:
