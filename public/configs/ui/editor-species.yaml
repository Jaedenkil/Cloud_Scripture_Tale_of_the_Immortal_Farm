# ═══════════════════════════════════════════════════════════════
# 物种编辑器 (Species Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第二层 · 内容构件
#
# 作用：
#   定义游戏中所有生物的物理形态模板。
#   物种是角色和 NPC 的基础——先有物种（骨骼+外观+能力），再有具体角色。
#   不同模板等级提供不同的属性加成（如精英模板力量×1.5，普通模板×1.0）。
#
# 核心功能：
#   - 骨架编辑：定义骨骼节点树（头/躯干/上臂/前臂/手/大腿/小腿/脚的
#     层级关系、初始位置、旋转轴约束）
#   - 骨架动画：为每个骨骼节点编辑关键帧序列，内置动画类型：
#     行走(walk)、休息(idle)、奔跑(run)、攻击(attack)、
#     受击(hurt)、死亡(death)、采集(gather)、跳跃(jump)
#   - 基础纹理：将材质贴图映射到骨骼网格（引用材质编辑器输出）
#   - 碰撞体积：包围盒尺寸（宽/高/深）、碰撞偏移
#   - 属性加成模板：定义物种等级和对应的属性倍率
#     例：普通人类 → 力量×1.0/敏捷×1.0
#         精英妖兽 → 力量×1.5/攻击×1.5/生命×2.0
#         远古灵禽 → 敏捷×2.0/灵力×1.8
#   - 音效绑定：脚步声、叫声/语音、受伤音效（引用音效编辑器输出）
#   - 3D 预览：在编辑器中实时预览骨架结构和动画播放
#
# 输出配置：configs/species/*.yaml
#   格式示例：
#     species:
#       id: "human_base"
#       name: "人族"
#       skeleton:
#         root:
#           - bone: "spine"
#             position: [0, 0.5, 0]
#             children:
#               - bone: "head"
#                 position: [0, 0.6, 0]
#               - bone: "arm_left"
#                 position: [-0.3, 0.5, 0]
#               - bone: "arm_right"
#                 position: [0.3, 0.5, 0]
#           - bone: "leg_left"
#             position: [-0.15, 0, 0]
#           - bone: "leg_right"
#             position: [0.15, 0, 0]
#       animations:
#         idle:
#           duration: 2.0
#           loop: true
#           keyframes: [...]
#         walk:
#           duration: 0.8
#           loop: true
#           keyframes: [...]
#       texture: "mat_human_skin_base"
#       collider: { width: 0.6, height: 1.8, depth: 0.6 }
#       templates:
#         normal:
#           strength: 1.0
#           agility: 1.0
#           spirit: 1.0
#           health: 100
#         elite:
#           strength: 1.5
#           agility: 1.2
#           spirit: 1.3
#           health: 200
#       sounds:
#         footstep: "sfx_step_human"
#         hurt: "sfx_hurt_human"
#
# 依赖：材质编辑器（骨骼纹理）、音效编辑器（生物音效）
# 被引用方：角色编辑器（创建具体角色）、群落编辑器（生物生成表）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_species
  name: 物种编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "物种编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义游戏中所有生物的物理形态模板。物种是角色和 NPC 的基础——先有物种（骨骼+外观+能力），再有具体角色。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
