# 游戏内 HUD 配置

page:
  id: game_hud
  name: 游戏HUD
  type: hud
  blockInput: false  # HUD 不阻挡游戏输入

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  # 左上角 - 玩家信息
  - id: playerInfo
    type: panel
    width: "87px"
    height: "auto"
    layout:
      horizontalAlignment: left
      verticalAlignment: top
      left: "17px"
      top: "20px"
    style:
      background: "$bgMedium"
      cornerRadius: 3
      padding: "5px"
      thickness: 1
      borderColor: "$border"
    children:
      - id: playerName
        type: dynamicText
        binding: player.name
        template: "{value}"
        style:
          color: "$textPrimary"
          fontSize: 8
          fontWeight: bold

      - id: cultivationLevel
        type: dynamicText
        binding: player.cultivation
        template: "境界: {value}"
        style:
          color: "$primary"
          fontSize: 6

      - id: spiritBar
        type: progressBar
        binding: player.spirit
        max: player.maxSpirit
        style:
          width: "100%"
          height: "3px"
          backgroundColor: "rgba(0,0,0,0.3)"
          fillColor: "$primary"
          cornerRadius: 1

      - id: spiritText
        type: dynamicText
        binding: player.spirit
        template: "灵力: {value}/{max}"
        style:
          color: "$textSecondary"
          fontSize: 6

  # 右上角 - 小地图
  - id: minimap
    type: panel
    width: "60px"
    height: "60px"
    layout:
      horizontalAlignment: right
      verticalAlignment: top
      right: "17px"
      top: "20px"
    style:
      background: "$bgMedium"
      cornerRadius: 3
      borderWidth: 1
      borderColor: "$primary"
    children:
      - id: minimapCanvas
        type: canvas
        width: "100%"
        height: "100%"
        renderer: minimap

      - id: minimapLabel
        type: text
        text: "小地图"
        style:
          color: "$textMuted"
          fontSize: 5
          horizontalAlignment: center
          bottom: "1px"

  # 底部中央 - 快捷栏
  - id: hotbar
    type: panel
    width: "auto"
    height: "24px"
    layout:
      horizontalAlignment: center
      verticalAlignment: bottom
      bottom: "17px"
    style:
      background: "$bgMedium"
      cornerRadius: 3
      padding: "3px"
      thickness: 1
      borderColor: "$border"
    children:
      - id: hotbarSlots
        type: slotGrid
        columns: 9
        rows: 1
        slotSize: 17
        spacing: 1
        binding: player.hotbar
        style:
          slotBackground: "rgba(50, 80, 115, 0.6)"
          slotBorder: "$primary"
          selectedBorder: "$accent"
          selectedWidth: 1

  # 底部左侧 - 提示信息
  - id: hintText
    type: text
    text: "按 ESC 暂停"
    layout:
      horizontalAlignment: left
      verticalAlignment: bottom
      left: "17px"
      bottom: "8px"
    style:
      color: "$textMuted"
      fontSize: 6

  # 中央 - 交互提示（条件显示）
  - id: interactionHint
    type: panel
    width: "auto"
    height: "auto"
    layout:
      horizontalAlignment: center
      verticalAlignment: center
      top: "33px"
    visible: false
    binding: interaction.available
    style:
      background: "rgba(18, 32, 48, 0.8)"
      cornerRadius: 3
      padding: "3px 7px"
      thickness: 1
      borderColor: "$border"
    children:
      - id: interactionText
        type: dynamicText
        binding: interaction.text
        template: "[E] {value}"
        style:
          color: "$textPrimary"
          fontSize: 7

# 键盘快捷键
keybindings:
  Escape:
    action: pause
  
  "1-9":
    action: selectHotbarSlot
    param: slotIndex

actions:
  pause:
    type: setState
    target: PAUSED

  selectHotbarSlot:
    type: custom
    handler: selectHotbarSlot
