# ═══════════════════════════════════════════════════════════════
# 渲染风格编辑器 (Render Style Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第三层 · 场景组合
#
# 作用：
#   定义 HD2D 后处理管线的视觉风格参数集。
#   同一场景数据 + 不同渲染风格配置 = 完全不同的视觉体验。
#   实现「修仙清韵」「赛博霓虹」「末日荒芜」等多种美术风格切换。
#
# 核心功能：
#   - 景深 (Depth of Field)：
#     · 焦距、焦平面距离、前景/背景模糊强度
#     · 光圈形状（圆形/六边形散景）
#   - 泛光 (Bloom)：
#     · 亮度阈值（多亮的像素才泛光）
#     · 泛光强度、扩散半径
#     · 泛光色调偏移
#   - 体积光 (God Rays)：
#     · 光源方向、光柱密度、衰减距离
#     · 光柱颜色和强度
#   - 色调映射 (Tone Mapping)：
#     · 映射曲线类型（Reinhard/ACES/Filmic）
#     · 曝光补偿、对比度
#   - 像素化 (Pixelation)：
#     · 像素化程度（HD2D 的核心参数）
#     · 应用范围（全屏/仅前景/仅背景）
#   - 调色板滤镜 (Color Grading)：
#     · 色相偏移、饱和度调整、亮度曲线
#     · LUT（查找表）引用
#     · 暗角（Vignette）强度和范围
#   - 环境遮蔽 (AO)：
#     · SSAO 半径、强度、采样数
#   - 预设对比预览：编辑器内左右分屏对比调整效果
#
# 输出配置：configs/render-styles/*.yaml
#   格式示例：
#     renderStyle:
#       id: "xianxia_ethereal"
#       name: "修仙清韵"
#       depthOfField:
#         focalLength: 50
#         focalDistance: 10
#         backgroundBlur: 0.3
#         foregroundBlur: 0.1
#         bokehShape: "hexagon"
#       bloom:
#         threshold: 0.8
#         intensity: 0.4
#         spread: 3
#         tint: "#E8F0FF"
#       godRays:
#         direction: [-0.5, -1, -0.3]
#         density: 0.3
#         decay: 0.95
#         color: "#FFE8C0"
#       toneMapping:
#         type: "ACES"
#         exposure: 1.1
#         contrast: 1.05
#       pixelation:
#         level: 2
#         scope: "full"
#       colorGrading:
#         hueShift: 5
#         saturation: 0.9
#         brightness:
#           shadows: -0.05
#           midtones: 0.0
#           highlights: 0.1
#         vignette:
#           intensity: 0.3
#           radius: 0.8
#       ao:
#         radius: 0.5
#         intensity: 0.6
#
#   另一风格示例：
#     renderStyle:
#       id: "cyberpunk_neon"
#       name: "赛博霓虹"
#       bloom:
#         threshold: 0.5
#         intensity: 0.9      # 强泛光 → 霓虹感
#         spread: 5
#         tint: "#FF44FF"
#       colorGrading:
#         saturation: 1.4     # 高饱和
#         hueShift: -15       # 偏紫
#       pixelation:
#         level: 3            # 更粗的像素感
#
# 依赖：无直接依赖（纯后处理参数）
# 被引用方：场景编辑器（场景指定渲染风格）、渲染内核（应用后处理管线）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_render_style
  name: 渲染风格编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "渲染风格编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义 HD2D 后处理管线的视觉风格参数集。同一场景数据 + 不同渲染风格配置 = 完全不同的视觉体验，实现多种美术风格切换。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
