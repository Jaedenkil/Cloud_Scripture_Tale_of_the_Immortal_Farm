# ═══════════════════════════════════════════════════════════════
# 物块编辑器 (Block Editor)
# ═══════════════════════════════════════════════════════════════
# 所属层级：第二层 · 内容构件
#
# 作用：
#   定义体素世界中所有方块类型及其行为属性。
#   方块是构成游戏世界的最小单位，包含视觉、物理、交互三个维度的配置。
#
# 核心功能：
#   - 纹理配置：为方块 6 个面分别指定材质（引用材质编辑器输出）
#   - 碰撞体类型：实心、半砖（台阶/栅栏）、无碰撞（花草/灵气）
#   - 物理属性：硬度（影响破坏时间）、爆炸抗性、重力（沙/砾石下落）
#   - 光源属性：发光强度（0-15）、发光颜色（灵石/岩浆发光）
#   - 掉落配置：破坏后掉落的物品及概率（引用物品编辑器输出）
#   - 交互行为：灵田土壤可种植、水方块可流动、熔炉可交互打开
#   - 音效绑定：放置音效、破坏音效、行走音效（引用音效编辑器输出）
#   - 3D 预览：在编辑器内实时预览方块外观
#
# 输出配置：configs/blocks/*.yaml
#   格式示例：
#     block:
#       id: "spirit_soil"
#       name: "灵田土壤"
#       textures:
#         top: "mat_spirit_soil_top"      # 材质 ID
#         bottom: "mat_dirt"
#         sides: "mat_spirit_soil_side"
#       collision: "solid"
#       hardness: 2.0
#       lightLevel: 3
#       lightColor: "#88CCFF"
#       drops:
#         - item: "item_spirit_soil"
#           chance: 1.0
#       behavior: "plantable"
#       sounds:
#         place: "sfx_block_place_dirt"
#         break: "sfx_block_break_dirt"
#         step: "sfx_step_dirt"
#
# 依赖：材质编辑器（方块纹理）、音效编辑器（交互音效）
# 被引用方：群落编辑器（地形方块调色板）、场景编辑器（场景固定物块）
# ═══════════════════════════════════════════════════════════════

page:
  id: editor_block
  name: 物块编辑器
  type: overlay

container:
  width: "100%"
  height: "100%"
  background: transparent

components:
  - id: bgOverlay
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "rgba(8, 16, 28, 0.88)"
      thickness: 0

  - id: mainPanel
    type: rectangle
    width: "100%"
    height: "100%"
    style:
      background: "$bgDark"
      cornerRadius: 0
      thickness: 0
    children:
      # ─────────── 顶部标题栏 ───────────
      - id: backBtn
        type: button
        text: "← 返回"
        action: goBackToDevTools
        layout:
          top: "-150px"
          left: "-275px"
        style:
          width: "53px"
          height: "19px"
          fontSize: "$buttonFontSize"
          cornerRadius: "$buttonCornerRadius"
          background: "$btnSecondary"
          color: "$btnTextNormal"
          thickness: "$buttonBorderWidth"
          borderColor: "$border"

      - id: editorTitle
        type: title
        text: "物块编辑器"
        layout:
          top: "-150px"
        style:
          width: "100%"
          height: "$titleLargeHeight"
          fontSize: 18
          color: "$textPrimary"
          textAlign: center
          shadowColor: "rgba(74, 155, 232, 0.35)"
          shadowBlur: 3

      - id: helpBtn
        type: button
        text: "?"
        action: toggleHelp
        layout:
          top: "-150px"
          left: "275px"
        style:
          width: "19px"
          height: "19px"
          fontSize: 12
          cornerRadius: 10
          background: "rgba(74, 155, 232, 0.25)"
          color: "$textSecondary"
          thickness: 1
          borderColor: "$border"

      - id: headerDivider
        type: rectangle
        width: "90%"
        height: "$dividerHeight"
        layout:
          top: "-130px"
        style:
          background: "$divider"
          thickness: 0

      # ─────────── 帮助气泡 ───────────
      - id: helpTooltip
        type: rectangle
        visible: false
        layout:
          top: "-110px"
          left: "120px"
        style:
          width: "260px"
          height: "80px"
          background: "rgba(20, 35, 55, 0.95)"
          cornerRadius: 6
          thickness: 1
          borderColor: "$border"
        children:
          - id: helpText
            type: text
            text: "定义体素世界中所有方块类型及其行为属性。方块是构成游戏世界的最小单位，包含视觉、物理、交互三个维度的配置。"
            style:
              width: "240px"
              height: "70px"
              fontSize: 10
              color: "$textSecondary"
              textWrapping: true
              textAlign: left

      # ─────────── 编辑器内容区域（待实现） ───────────

actions:
  goBackToDevTools:
    type: goBack
  toggleHelp:
    type: toggleTooltip
    targetId: helpTooltip

keybindings:
  Escape:
    action: goBackToDevTools
