registryVersion: 1
id: ui-registry
description: UI page registry for flow runtime

defaults:
  enabled: true
  preload: false

pages:
  - id: logo-page
    domain: panel
    scenePath: scenes/panel/logo.yaml
    enabled: true
    preload: true
    tags:
      - splash
      - startup

  - id: home-page
    domain: panel
    scenePath: scenes/panel/home.yaml
    enabled: true
    preload: true
    tags:
      - home
      - menu

  - id: settings-page
    domain: panel
    scenePath: scenes/panel/settings.yaml
    enabled: true
    preload: false
    tags:
      - settings

  - id: world-base-page
    domain: world
    scenePath: scenes/world/base.yaml
    enabled: true
    preload: true
    tags:
      - world
      - base

  - id: hud-status-page
    domain: hud
    scenePath: scenes/hud/status.yaml
    enabled: true
    preload: true
    tags:
      - hud
      - status

  - id: system-blocker-page
    domain: system
    scenePath: scenes/system/blocker.yaml
    enabled: true
    preload: true
    tags:
      - system
      - blocker

  - id: exit-confirm-page
    domain: system
    scenePath: scenes/system/exit-confirm.yaml
    enabled: true
    preload: true
    tags:
      - system
      - confirm
      - modal

aliases:
  start-page: home-page