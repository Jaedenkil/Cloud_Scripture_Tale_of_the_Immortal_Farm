page:
  id: dev-tool-spine-animation-manager-page
  name: Dev Tool - Spine Animation Manager
  type: fullscreen
  domain: panel
  depthBase: 2000

layers:
  - id: panel.bg
    depth: 2000
  - id: panel.content
    depth: 2010
    inputPolicy: capture

components:
  - id: spine-manager-bg
    type: rectangle
    layer: panel.bg
    style:
      background: "$colors.panelBgMain"
      width: "100%"
      height: "100%"

  - id: spine-manager-top-box
    type: rectangle
    layer: panel.content
    style:
      left: 24
      right: 24
      top: 24
      height: 128
      background: "$colors.panelBgSecondary"
      borderColor: "$colors.panelBorder"
      borderWidth: "$components.borderNormal"

  - id: spine-manager-title
    type: title
    layer: panel.content
    text: "人物动画管理器（Spine 最小版）"
    style:
      width: "calc(100% - 96px)"
      left: 48
      top: 42
      textAlign: "center"
      color: "$colors.textPrimary"
      fontSize: "$typography.h2"

  - id: spine-manager-desc
    type: title
    layer: panel.content
    text: "用于动画状态映射与预览，支持关键事件帧标记与资源一致性校验。"
    style:
      width: "calc(100% - 96px)"
      left: 48
      top: 82
      textAlign: "center"
      color: "$colors.textSecondary"
      fontSize: "$typography.body"

  - id: spine-manager-middle-box
    type: rectangle
    layer: panel.content
    style:
      left: 24
      right: 24
      top: 168
      bottom: 140
      background: "$colors.panelBgMain"
      borderColor: "$colors.panelBorder"
      borderWidth: "$components.borderNormal"

  - id: spine-manager-middle-title
    type: title
    layer: panel.content
    text: "功能占位区域（后续开发）"
    style:
      width: "100%"
      left: 0
      right: 0
      top: "calc(50% - 12px)"
      textAlign: "center"
      color: "$colors.textSecondary"
      fontSize: "$typography.body"

  - id: spine-manager-bottom-box
    type: rectangle
    layer: panel.content
    style:
      left: 24
      right: 24
      bottom: 24
      height: 96
      background: "$colors.panelBgSecondary"
      borderColor: "$colors.panelBorder"
      borderWidth: "$components.borderNormal"

  - id: spine-manager-save-btn
    type: button
    layer: panel.content
    text: "保存"
    actionId: "dev.tools.save"
    style:
      background: "$colors.btnPrimaryBg"
      borderColor: "$colors.panelBorder"
      color: "$colors.btnPrimaryText"
      width: 180
      height: "$components.btnHeightNormal"
      left: "calc(50% - 194px)"
      bottom: 56

  - id: spine-manager-back-btn
    type: button
    layer: panel.content
    text: "后退"
    actionId: "dev.tools.back"
    style:
      background: "$colors.btnSecondaryBg"
      borderColor: "$colors.panelBorder"
      color: "$colors.btnSecondaryText"
      width: 180
      height: "$components.btnHeightNormal"
      left: "calc(50% + 14px)"
      bottom: 56
