page:
  id: home-page
  name: Home Page
  type: fullscreen
  domain: panel
  depthBase: 2000

layers:
  - id: panel.bg
    depth: 2000
  - id: panel.content
    depth: 2010
    inputPolicy: capture

components:
  - id: home-bg
    type: rectangle
    layer: panel.bg
    style:
      background: "$colors.panelBgMain"
      width: "100%"
      height: "100%"

  - id: home-title
    type: title
    layer: panel.content
    text: "云笈仙田录"
    style:
      color: "$colors.textPrimary"
      fontSize: 56
      width: "100%"
      left: 0
      right: 0
      top: 92
      textAlign: "center"

  - id: btn-start
    type: button
    layer: panel.content
    text: "开始"
    actionId: "startGame"
    style:
      background: "$colors.btnPrimaryBg"
      borderColor: "$colors.panelBorder"
      color: "$colors.btnPrimaryText"
      height: "$components.btnHeightNormal"
      width: 280
      top: 232
      left: 0
      right: 0
      marginLeft: "auto"
      marginRight: "auto"

  - id: btn-settings
    type: button
    layer: panel.content
    text: "设置"
    actionId: "settings"
    style:
      background: "$colors.btnSecondaryBg"
      borderColor: "$colors.panelBorder"
      color: "$colors.btnSecondaryText"
      height: "$components.btnHeightNormal"
      width: 280
      top: 284
      left: 0
      right: 0
      marginLeft: "auto"
      marginRight: "auto"

  - id: btn-dev
    type: button
    layer: panel.content
    text: "开发工具"
    actionId: "dev"
    style:
      background: "$colors.btnSecondaryBg"
      borderColor: "$colors.panelBorder"
      color: "$colors.btnSecondaryText"
      height: "$components.btnHeightNormal"
      width: 280
      top: 336
      left: 0
      right: 0
      marginLeft: "auto"
      marginRight: "auto"

  - id: btn-quit
    type: button
    layer: panel.content
    text: "退出"
    actionId: "ui.exit.request"
    style:
      background: "$colors.btnSecondaryBg"
      borderColor: "$colors.panelBorder"
      color: "$colors.btnSecondaryText"
      height: "$components.btnHeightNormal"
      width: 280
      top: 388
      left: 0
      right: 0
      marginLeft: "auto"
      marginRight: "auto"