flow:
  id: main-ui-flow
  version: 1
  entry: logo
  defaults:
    backActionId: back
    transition:
      type: fade
      durationMs: 200
      delayMs: 0
      easing: linear
      blockInput: true
      skippable: false

nodes:
  - id: logo
    pageId: logo-page
    domain: panel
    meta:
      title: Logo Page
      tags:
        - startup
    transitions:
      - id: logo-to-home
        trigger: timer
        afterMs: 1800
        to: home
        transition: fadeLogo
    fallback: home

  - id: home
    pageId: start-page
    domain: panel
    meta:
      title: Home Page
      tags:
        - menu
    transitions:
      - id: home-to-exit-confirm
        trigger: uiAction
        fromActionId: ui.exit.request
        to: exit-confirm
        transition: fadeFast
    fallback: home

  - id: settings
    pageId: settings-page
    domain: panel
    meta:
      title: Settings Page
      tags:
        - settings
    transitions: []
    fallback: home

  - id: exit-confirm
    pageId: exit-confirm-page
    domain: system
    meta:
      title: Exit Confirm
      tags:
        - modal
        - exit
    transitions:
      - id: exit-confirm-cancel
        trigger: uiAction
        fromActionId: ui.exit.cancel
        to: home
        transition: fadeFast
      - id: exit-confirm-confirm
        trigger: uiAction
        fromActionId: ui.exit.confirm
        to: home
        transition: fadeFast
    fallback: home

guards: {}

transitionPresets:
  fadeLogo:
    type: fade
    durationMs: 420
    delayMs: 0
    easing: linear
    blockInput: true
    skippable: false

  fadeFast:
    type: fade
    durationMs: 120
    delayMs: 0
    easing: linear
    blockInput: true
    skippable: false