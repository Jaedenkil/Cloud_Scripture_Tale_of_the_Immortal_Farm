page:
  id: settings
  name: 设置
  description: 系统设置页面
  sections:
    - id: display
      title: 显示设置
      fields:
        - id: resolution
          type: select
          label: 分辨率
          description: 修改窗口内容区分辨率，应用后立即生效并锁定窗口尺寸。
          options:
            - id: r_1200_720
              label: "1200 x 720 (5:3)"
              width: 1200
              height: 720
            - id: r_1280_720
              label: "1280 x 720 (16:9)"
              width: 1280
              height: 720
            - id: r_1440_900
              label: "1440 x 900 (8:5)"
              width: 1440
              height: 900
            - id: r_1500_900
              label: "1500 x 900 (5:3)"
              width: 1500
              height: 900
            - id: r_1600_900
              label: "1600 x 900 (16:9)"
              width: 1600
              height: 900
            - id: r_1920_1080
              label: "1920 x 1080 (16:9)"
              width: 1920
              height: 1080
  actions:
    - id: apply-resolution
      text: 应用分辨率
      type: primary
    - id: back-main
      text: 返回首页
      type: secondary
layout:
  viewportBase: full-window
  designBaseline: current-content-area
  style:
    shellMaxWidth: "$style.pages.settings.shellMaxWidth"
    cardWidth: "$style.pages.settings.cardWidth"
    cardRadius: "$style.pages.settings.cardRadius"
    cardPadding: "$style.pages.settings.cardPadding"
    titleSize: "$style.pages.settings.titleSize"
    sectionMarginTop: "$style.pages.settings.sectionMarginTop"
    sectionPadding: "$style.pages.settings.sectionPadding"
    sectionRadius: "$style.pages.settings.sectionRadius"
  root:
    width: 100%
    height: 100%
    overflowX: hidden
    overflowY: hidden
  zones:
    - id: header
      role: title-zone
      heightRatio: 0.2
    - id: content
      role: settings-main-zone
      heightRatio: 0.64
    - id: footer
      role: action-zone
      heightRatio: 0.16
  panelConstraints:
    keepInsideWindow: true
    widthMode: window-ratio
    maxWidthRatio: 0.56
    minWidthPx: 520
    maxHeightRatio: 0.78
    overflowX: hidden
    overflowY: auto
  cardConstraints:
    keepInsideWindow: true
    overflowX: hidden
    overflowY: auto
  acceptance:
    noHorizontalScroll: true
    noCardOverflowOutsideWindow: true
